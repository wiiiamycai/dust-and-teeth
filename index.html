// ================= LOCATIONS =================
function card(x){const n=S.n[x];return{icon:NPC[x].i,name:NPC[x].n,sub:`Lv ${n.lvl} · ${mood(n.op)}${n.loc==='pen'?' · in chains':''}`,bang:n.rx.length>0,on:()=>x==='king'?go('throne'):go('talk',x)}}
function spouseTalk(){const s=S.spouse;if(!s||!alive(s))return;const n=S.n[s];if(n.rx.length){quote(`${NPC[s].n}: ${n.rx.shift()}`);return}
  if(roll(25))quote(pick(s==='bess'?[`Bess: "Is this what outside is? Mostly sand."`,`Bess: "Can we kill something today? Just a little something?"`,`Bess: "I love you. I think. I've only met eleven people."`]:
    [`Bert: "Pre-war tractors had seats with springs. Springs!"`,`Bert: "If you ever sell me, get a good price. For my self-esteem."`,`Bert: "Married life is great. I have nothing to compare it to."`]))}
const HUBT={
  scrapwell:()=>`Thirty-one people, eleven goats, one filthy well.${alive('elder')?'':' Ma Thistle\'s chair is empty.'}`,
  well:()=>S.n.nigel.loc==='well'&&alive('nigel')?'Dark, wet, and something down here glows.':'Chicken bones and a dentist\'s chair made from a car seat.',
  rustwater:()=>S.f.pumpOpen||S.f.hanged?'The pump runs free. Someone is singing, badly.':'Two hundred people, one pump. The Mayor owns it. Water is 10 teeth a cup.',
  farm:()=>'Twenty acres of "resting" dirt.'+(S.f.scareHat?'':' A scarecrow wears a surprisingly good hat.'),
  diner:()=>alive('lou')?'The sign says MEET. Lou waves a ladle at you.':'Cold kitchen. The pot is still on the stove. Don\'t look in.',
  chainfield:()=>S.f.freed?'Empty pens. Someone wrote THANK YOU on the sign.':'A slaver camp in an old car park. Pens made of shopping trolleys.',
  skybus:()=>S.f.molesDead?'A dead plane. Every seat still full, everyone buckled in.':'A crashed plane. The sand around it is moving.',
  silo:()=>S.f.siloIn?'Concrete. Teeth on poles. A hum you can feel in your fillings.':'A hole in the desert ringed with poles. Each pole is topped with teeth. Guards at the gate.'
};
const HUBO={
  scrapwell:()=>[['Climb down the well',()=>go('hub','well')],['Your shack (sleep, or retire)',()=>go('shack')]],
  rustwater:()=>[S.f.pumpOpen||S.f.hanged?['Drink from the free pump',()=>{say(`+${heal(6)} HP.`);goHere()}]:[`Cup of water (10 teeth, +6 HP)`,()=>{if(pay(10))say(`+${heal(6)} HP. Tastes faintly of the Mayor.`);goHere()}]],
  farm:()=>[!S.f.scareHat?['Take the scarecrow\'s hat',()=>{S.f.scareHat=1;give('hat');if(alive('hector')&&roll(40)){S.n.hector.op-=5;say('Hector: "That\'ll be five teeth." You pay.');S.teeth=Math.max(0,S.teeth-5)}else say('Got a hat.');goHere()}]:null],
  diner:()=>alive('lou')?[[`Order the stew (5 teeth)`,()=>stew()],[S.f.kitchen?'Go into the kitchen':`Sneak into the kitchen ${tag('sneak',-10)}`,()=>{if(S.f.kitchen||chk('sneak',-10)){S.f.kitchen=1;go('kitchen')}else{bad('Junior blocks the door. He puts a cleaver down, very slowly.');goHere()}}]]:[],
  chainfield:()=>S.f.freed?[]:[[`Open the pens at night ${tag('steal',S.f.slaver?0:-15)}`,()=>{if(chk('steal',S.f.slaver?0:-15))freePens();else{bad('A lock squeals. Floodlights. "Thief!"');fight([...(alive('krug')?[foe('krug')]:[]),slv(),slv()],{started:true,win:'pens',back:['map']})}}]],
  skybus:()=>!S.f.molesDead?[['Fight the rad-moles',()=>fight([mkE('Rad-mole','🐀',2,{loot:{meat:1},teeth:0}),mkE('Rad-mole','🐀',2,{teeth:0})],{win:'moles',back:['map']}),'danger']]:[
    !S.f.cockpit?['Search the cockpit',()=>{S.f.cockpit=1;if(!S.weapons.includes('rifle'))S.weapons.push('rifle');say('A skeleton pilot. A Hunting Rifle in the locker. A note: "We are cleared for landing. So is everything else."');goHere()}]:null,
    !S.f.coilGot&&!has('coil')?[`Salvage the galley heating coil ${tag('science')}`,()=>{if(chk('science')){give('coil');S.f.coilGot=1;say('One heating coil. It might toast.')}else{bad('Zap. -8 HP.');if(hurt(8,'Electrocuted by a plane that crashed 200 years ago.'))return}goHere()}]:null,
    !S.f.luggage?['Search the luggage',()=>{S.f.luggage=1;give('gutglue');gain(15);say('Gut Glue, 15 teeth, and a novel called "Fifty Shades of Beige". It\'s worse than the bombs.');goHere()}]:null],
  silo:()=>!S.f.siloIn?[['Attack the gate guards',()=>fight([mkE('Molar guard','🦷',6),mkE('Molar guard','🦷',6,{arm:'spikes'})],{started:true,win:'siloin',back:['map']}),'danger'],
    [`Sneak past ${tag('sneak',-25)}`,()=>{if(chk('sneak',-25)){S.f.siloIn=1;say('You slip in behind a cart of diggers.');goHere()}else{bad('"Intruder!"');fight([mkE('Molar guard','🦷',6),mkE('Molar guard','🦷',6)],{win:'siloin',back:['map']})}}],
    S.f.slaver?['Flash your slaver tattoo: "Krug sent me."',()=>{S.f.siloIn=1;say('They wave you in. Krug\'s people come here all the time.');goHere()}]:null,
    [`Bribe them (150 teeth)`,()=>{if(pay(150)){S.f.siloIn=1;say('They count it twice and step aside.')}goHere()}]]:[
    !S.armors.includes('riot')?[`Break into the armoury ${tag('steal',-15)}`,()=>{if(chk('steal',-15)){S.armors.push('riot');S.armor='riot';gainXP(100);say('A PRE-WAR RIOT SUIT. You put it on. You feel like a walking tank. (Armour 10, equipped)');goHere()}else{bad('Alarm!');fight([mkE('Molar elite','🦷',7),mkE('Molar elite','🦷',7)],{win:'back',back:['map']})}}]:null,
    !S.f.pitFreed?[`Free the diggers in the pit ${tag('steal',-10)}`,()=>{if(chk('steal',-10)){S.f.pitFreed=1;karma(3);gainXP(150);say('Chains drop. The diggers riot. The King\'s elite guards will be busy for a while.')}else{bad('A guard spots you.');return fight([mkE('Molar elite','🦷',7)],{win:'back',back:['map']})}goHere()}]:null,
    !S.f.kingStopped?[`Crawl the maintenance shaft to the launch console ${tag('science',-20)}`,()=>{if(chk('science',-20)){stopKing('sabotage');S.f.sabotaged=1;say('You cut the right wires. The Big Tooth goes quiet. Nobody knows yet.')}else{bad('Wrong wire. -10 HP.');if(hurt(10,'Fried in a missile silo.'))return}goHere()}]:null,
    alive('king')?['Enter the throne room',()=>go('throne'),'danger']:['The launch console',()=>go('console')]]
};
SC.hub=loc=>{S.here=loc;const L=LOC[loc];
  if(S.crater[loc])return show({title:L.n,icon:'☢️',sub:'crater',text:'A glowing crater. Nothing will live here again. You did that.',opts:[['Leave',()=>go('map')],charOpt()]});
  const hs=IDS.filter(x=>hostile(x)&&S.n[x].loc===loc);if(hs.length&&S.f.sneakIn!==loc)return go('ambush',loc);
  if(S.f.sneakIn&&S.f.sneakIn!==loc)S.f.sneakIn=null;
  spouseTalk();
  if(loc==='rustwater'&&S.f.raidNews&&!S.f.raidSeen){S.f.raidSeen=1;if(S.f.raidResult==='held')say('Bullet holes, dead Molars, cheering. Rustwater held. Because you warned them.');else bad(`Smoke. The Molars hit Rustwater.${S.f.raidDead.length?' '+S.f.raidDead.map(x=>NPC[x].n).join(' and ')+' didn\'t make it.':''}${S.f.mayorTribute?' Funny: the Mayor\'s office wasn\'t touched.':''}`)}
  const cards=(loc==='silo'&&!S.f.siloIn)?[]:IDS.filter(x=>alive(x)&&x!==S.spouse&&(S.n[x].loc===loc||(loc==='chainfield'&&S.n[x].loc==='pen'))).map(card);
  show({title:L.n,icon:L.i,sub:`Danger ${L.lvl} · Day ${S.day}`,text:HUBT[loc](),cards,opts:[...(HUBO[loc]?HUBO[loc]():[]),corpseOpt(),
    loc==='well'?['Climb back up',()=>go('hub','scrapwell')]:['Leave (map)',()=>go('map')],charOpt()]});
};
SC.ambush=loc=>{const hs=IDS.filter(x=>hostile(x)&&S.n[x].loc===loc);if(!hs.length)return go('hub',loc);
  const en=[];hs.forEach(x=>crew(x).forEach(e=>{if(!e.npc||!en.some(y=>y.npc===e.npc))en.push(e)}));
  show({title:LOC[loc].n,icon:'⚠️',sub:'They remember you',text:`${hs.map(x=>NPC[x].n).join(' and ')} ${hs.length>1?'are':'is'} waiting for you.`,cards:en.map(e=>({icon:e.i,name:e.n,sub:'Lv '+e.lvl})),opts:[
    ['Fight',()=>fight(en,{win:'hub',args:[loc],back:['map']}),'danger'],
    [`Sneak in ${tag('sneak',-15)}`,()=>{if(chk('sneak',-15)){S.f.sneakIn=loc;say('You slip past them.');go('hub',loc)}else{bad('Spotted.');fight(en,{win:'hub',args:[loc],back:['map']})}}],
    ['Turn back',()=>go('map')]]});
};
WIN.moles=()=>{S.f.molesDead=1;goHere()};
WIN.siloin=()=>{S.f.siloIn=1;goHere()};
WIN.pens=()=>{freePens();go('hub','chainfield')};
function freePens(){const f=S.f;if(f.freed)return;f.freed=1;karma(5);addTitle('Liberator of Chainfield');gainXP(200);event('freed',null,{loc:'chainfield'});
  ['bess','bert'].forEach(x=>{if(alive(x)&&S.n[x].loc==='pen'){S.n[x].loc='farm';event('rescued',x,{loc:'chainfield'});if(x==='bess')f.bessHome=1;say(`${NPC[x].n} runs for home.`)}});
  if(alive('teo'))S.n.teo.loc='rustwater';if(alive('krug'))S.n.krug.op=-100;f.sneakIn='chainfield';say('Forty people slip out into the night.');}
SC.shack=()=>show({title:'Your shack',icon:'🛏️',text:'Four walls. Three of them yours.',opts:[
  ['Sleep until tomorrow (heal)',()=>{if(tick())return go('ending');if(S.addicted&&!has('buzz')){heal(Math.floor(S.maxhp/3));bad('You sweat all night, dreaming of Buzz.')}else{heal(S.maxhp);say('You sleep like the dead.')}go('shack')}],
  ['Retire. Never leave again.',()=>{S.end={type:'retired'};go('ending')},'danger'],['Leave',()=>go('hub','scrapwell')]]});

// ================= TALK =================
SC.talk=id=>{if(!alive(id))return goHere();const n=S.n[id],d=NPC[id];
  while(n.rx.length)quote(`${d.n}: ${n.rx.shift()}`);
  if(hostile(id)){bad(`${d.n} attacks!`);return fight(crew(id),{win:'back',back:['map']})}
  const back=['Back',()=>goHere()];
  const atk=NPC[id].animal?null:[`Attack ${d.n}`,()=>fight(crew(id),{started:true,win:'back',back:['map']}),'danger'];
  const qk=id==='king'?null:[`Murder ${d.n} quietly ${tag('sneak',-(d.fighter?25:10))}`,()=>quiet(id,-(d.fighter?25:10)),'danger'];
  if(n.op<=-35&&!['hector','bess','bert','pete'].includes(id)){show({title:d.n,icon:d.i,sub:`Lv ${n.lvl} · ${mood(n.op)}`,text:`${d.n} won't talk to you.`,opts:[atk,qk,back]});return}
  const r=TALK[id]();if(!r)return;
  show({title:d.n,icon:d.i,sub:`Lv ${n.lvl} · ${mood(n.op)}`,text:r.t,opts:[...r.o,atk,qk,back]});
};
const re=id=>()=>go('talk',id);
const newsOpt=(id,dflt)=>['"Any news?"',()=>{quote(`${NPC[id].n}: ${news(id,dflt)}`);go('talk',id)}];
function sellSpouse(to){const x=S.spouse,nm=NPC[x].n;S.spouse=null;S.f.spouseWho=x;S.f.soldSomeone=1;
  if(to==='krug'){S.n[x].loc='pen';S.n[x].st.penDay=S.day;S.f.spouseFate='slave';karma(-5);addTitle('Sold Their Spouse to Slavers');event('sold',x,{loc:'chainfield'});
    quote(x==='bert'?`Krug checks Bert's teeth. "Good stock." Bert: "At least it's a good price. Thank you for that."`:`Krug inspects Bess. Bess inspects Krug. "Still more exciting than the farm," she says. Her eyes say something else.`);gain(perk('butcher')?600:300);go('talk','krug')}
  else{S.dead[x]=1;S.f.spouseFate='stew';karma(-6);addTitle('Sold Their Spouse for Stew');event('stew',x,{loc:'diner'});quote(`Lou has a "special room for couples". One short scream. "Come back Thursday. ${nm} is the special."`);gain(perk('butcher')?400:200);go('talk','lou')}}
function tattoo(){S.f.slaver=1;karma(-4);addTitle('Slaver');event('slaver',null,{loc:'chainfield'});say('Krug inks a chain on your neck. "Welcome to the family." +50 teeth.');gain(50);go('talk','krug')}
function stopKing(how){if(S.f.kingStopped)return;S.f.kingStopped=1;S.f.kingHow=how;gainXP(300)}
function flirt(x){if(chk('speech',-5)||S.stats.charm>=8){quote(`${NPC[x].n}: "Behind the barn. Ten minutes."`);say('It\'s the most interesting thing to happen on this farm in eleven years. Then: the click of a shotgun.');go('wedding',x)}else{bad(`${NPC[x].n} laughs at you. For quite a while.`);go('talk',x)}}
function penTalk(x){return{t:x==='bess'?(knows('bess','sold','bess')?'"Oh. It\'s you." Bess, in chains, does not look surprised.':'Bess, in chains.'):'"Hi," says Bert, in chains. "Krug says I have good teeth."',
  o:[[alive('krug')?`Pick her lock tonight ${tag('steal',-10)}`.replace('her',x==='bess'?'her':'his'):'Open the pen',()=>{if(!alive('krug')||chk('steal',-10))go('freed1',x);else{bad('A slaver spots you.');if(alive('krug'))S.n.krug.op-=30;fight([slv(),slv()],{started:true,win:'go',args:['freed1',x],back:['map']})}}]]}}
SC.freed1=x=>{const nm=NPC[x].n;S.n[x].loc='free';
  show({title:nm,icon:NPC[x].i,text:x==='bess'?'"You sold me. Then you came back." She rubs her wrists. "I don\'t know what we are."':'Bert rubs his wrists. "Thank you. I think. It\'s complicated."',opts:[
    ['"Go home to your father."',()=>{S.n[x].loc='farm';event('rescued',x);if(x==='bess')S.f.bessHome=1;gainXP(100);goHere()}],
    S.f.spouseWho===x?[`"Come back to me." ${tag('speech',-25)}`,()=>{if(chk('speech',-25)){S.spouse=x;S.n[x].loc='party';S.f.spouseFate=null;S.f.reunited=1;event('rescued',x);quote(`${nm}: "Fine. But I hold the knife from now on."`)}else{S.n[x].loc='farm';event('rescued',x);if(x==='bess')S.f.bessHome=1;bad(`${nm} laughs at you and walks home.`)}goHere()}]:null]})};
function stew(){if(!pay(5))return goHere();const f=S.f;f.stew=(f.stew||0)+1;
  if(f.louReformed||f.cannibal||f.stew===1){say(`${f.louReformed?'Mole-dog. Mostly.':'Rich, gamey, a texture you can\'t place.'} +${heal(12)} HP.`);goHere()}else go('stewreveal')}
SC.stewreveal=()=>show({title:"Mama Lou's",icon:'🍲',text:'Your spoon hits something. A fingernail. Painted. The label on the polish says "Sal\'s Sunday Best". Lou is watching you. Smiling.',opts:[
  ['Keep eating',()=>{S.f.cannibal=1;karma(-2);addTitle('Cannibal');event('cannibal',null,{loc:'diner'});say(`Lou beams like a proud mother. Corpses look like lunch now. +${heal(20)} HP.`);goHere()}],
  ['Spit it out',()=>{quote('Lou: "Bone in it? Happens. Very fresh, see."');goHere()}],
  dumb()?['Eat the fingernail too',()=>{S.f.cannibal=1;karma(-2);addTitle('Cannibal');event('cannibal',null,{loc:'diner'});say('Crunchy. Junior is impressed, and Junior has seen things.');goHere()}]:null]});
SC.kitchen=()=>{const p=S.n.pete,o=[];let t;
  if(!alive('pete')||p.loc!=='cage')t='Hooks, knives, a pot you could bathe in. The pantry cage is empty.';
  else{t='Hooks on the ceiling, some occupied. Two guard badges on a shelf. In a shopping-trolley cage: a guard with a label. PETE. TENDERISE TUESDAY. "Please," he whispers. "Sal was Monday."';
    if(!S.f.badge)o.push(['Take the badges',()=>{S.f.badge=1;give('badge');say('One says SAL. It\'s been gnawed.');go('kitchen')}]);
    o.push([`Pick the cage lock ${tag('steal',-10)}`,()=>{if(chk('steal',-10)){p.loc='rustwater';karma(2);gainXP(100);event('rescued','pete',{loc:'diner',wit:[]});say('You and Pete crawl out past the bins. He runs for Rustwater faster than anyone has ever run.');go('hub','diner')}
      else{bad('The lock snaps. Junior is in the doorway. "Not Tuesday yet."');fight([...(alive('junior')?[foe('junior')]:[]),...(alive('lou')?[foe('lou')]:[])],{started:true,win:'kitchenwin',back:['map']})}}]);
    o.push(['Leave him',()=>{karma(-2);say('He stops saying please after a while.');go('hub','diner')}]);
    o.push(['Kill Pete yourself. Kinder than Tuesday.',()=>{kill('pete','secret');S.n.lou.op+=10;quote('Lou: "I had a menu planned!" Then, softer: "You\'ve got a feel for it, honey."');go('hub','diner')},'danger']);}
  o.push(['Back to the dining room',()=>go('hub','diner')]);show({title:'The kitchen',icon:'🔪',text:t,opts:o})};
WIN.kitchenwin=()=>{if(alive('pete')&&S.n.pete.loc==='cage'){S.n.pete.loc='rustwater';karma(2);gainXP(100);event('rescued','pete',{loc:'diner',wit:[]});say('You let Pete out of his cage. He steps over the cooks and runs for Rustwater.')}go('hub','diner')};
SC.wedding=x=>{const nm=NPC[x].n;
  if(!alive('hector')){S.spouse=x;S.n[x].loc='party';S.f.spouseWho=x;addTitle('Married');event('married',x,{loc:'farm'});say(`No Hector, no wedding. ${nm} insists anyway. The scarecrow officiates.`);return go('hub','farm')}
  show({title:'Shotgun wedding',icon:'💒',text:`Hector. Shotgun. "Looks like we're having a wedding."`,opts:[
    ['"I do."',()=>{S.spouse=x;S.n[x].loc='party';S.f.spouseWho=x;addTitle('Married');event('married',x,{loc:'farm'});say(`Hector reads the vows from a tractor magazine. ${nm} cries. Hector cries. Dowry: 20 teeth and a promise not to shoot you. For now.`);gain(20);go('hub','farm')}],
    [`Talk your way out ${tag('speech',-20)}`,()=>{if(chk('speech',-20)){S.f.spouseFate='refused';say('You claim you\'re already married to a toaster. He\'s too confused to shoot. "Get off my farm."');go('map')}else{bad('"Nice speech. Wedding\'s still on."');go('wedding',x)}}],
    ['Fight Hector',()=>fight([foe('hector')],{started:true,win:'back',back:['map']}),'danger'],
    [`Run (${fleeP()}%)`,()=>{if(roll(fleeP())){S.f.spouseFate='refused';S.n.hector.op-=40;say('You run. Buckshot sings past your ears.');go('map')}else{bad('Buckshot in the backside. -8 HP.');if(hurt(8,'Shot at your own shotgun wedding.'))return;go('wedding',x)}}]]})};

const TALK={
  elder:()=>{const o=[],f=S.f;
    if(!f.elderGift)o.push([D('"I\'m going past the fence."','"Me go past fence."'),()=>{f.elderGift=1;give('gutglue',2);quote('Ma Thistle: "Good. Don\'t die near the well." (+2 Gut Glue)');go('talk','elder')}]);
    o.push(newsOpt('elder','"Nothing happens here. That\'s the point of here."'));
    if(S.day>=8&&!f.knowSilo)o.push(['"You look worried."',()=>{quote('Ma Thistle: "Bad dreams. A tooth in the ground, east past the plane. A king with no smile."');learnSilo();go('talk','elder')}]);
    if(f.nigel&&!f.elderTold)o.push(['Tell her about the well',()=>{f.elderTold=1;quote('Ma Thistle: '+({dead:'"Good. Never trusted anything that glows."',hat:'"You gave it a HAT? None of my husbands were that thoughtful."',dentist:'"A dentist? Does he do dentures?"',moved:'"Moved to a plane. Everyone needs a hobby."',lied:'"Dead, you say. You\'re a terrible liar. I like that."'}[f.nigel]));go('talk','elder')}]);
    return{t:D('94 years old. Smokes goat leather. "Spit it out."','Old lady. Smokes a goat. "Oh no. It\'s you."'),o}},
  gus:()=>{const o=[],f=S.f;let t='Gus. Mostly forearms. Has found water once.';
    if(!f.wellQ){t+=' "Something\'s eating the chickens we lower down the well. Sort it. 40 teeth."';o.push(['"I\'ll look into it."',()=>{f.wellQ=1;go('talk','gus')}])}
    else if(f.nigel&&!f.gusPaid){
      if(f.nigel==='hat'){o.push(['Tell the truth: it\'s a glowing dentist',()=>{f.nigel='dentist';f.gusPaid=1;quote('Gus: "A dentist? My back tooth\'s been killing me." He comes back up grinning, one tooth lighter.');gain(40);gainXP(75);event('helped','gus');go('talk','gus')}]);
        o.push([`Lie: say you killed it ${tag('speech')}`,()=>{if(chk('speech')){f.nigel='lied';f.gusPaid=1;quote('Gus: "Good riddance."');gain(40);gainXP(50);karma(-1)}else{bad('Gus: "Then why can I hear it humming?" No pay.');f.gusPaid=1;f.nigel='dentist'}go('talk','gus')}])}
      else o.push(['"It\'s dealt with."',()=>{f.gusPaid=1;quote('Gus: "Huh. Good." He pays you.');gain(40);gainXP(75);event('helped','gus');go('talk','gus')}]);
    }else t+=f.gusPaid?' "Chickens sleep better now."':' "Well? The chickens are nervous."';
    o.push(newsOpt('gus','"Dug a hole. Found dirt."'));return{t,o}},
  crumb:()=>{const o=[],f=S.f;const t=f.tfixed?'Brother Crumb bows low. "Prophet."':f.tstolen?'Crumb prays to an empty altar. A test of faith, he says. He\'s failing it.':'Crumb prays to a chrome toaster. "When it speaks, the Bread Times come." It hasn\'t popped in 200 years.';
    if(!f.tfixed&&!f.tstolen){
      if(has('coil'))o.push([`Fix the Toaster with your coil ${S.stats.brains>=8?'[Brains]':tag('science')}`,()=>{if(S.stats.brains>=8||chk('science')){take('coil');f.tfixed=1;karma(2);addTitle('Prophet of the Toaster');event('tfixed',null);give('gutglue',2);gain(20);gainXP(150);quote('POP. Toast hits Crumb in the face. "THE BREAD TIMES!" (+2 Gut Glue)')}else{bad('The Toaster bites. -6 HP.');if(hurt(6,'Electrocuted by a holy appliance.'))return}go('talk','crumb')}]);
      o.push([`Steal the Toaster ${tag('steal',-10)}`,()=>{if(chk('steal',-10)){f.tstolen=1;give('toaster');karma(-2);event('tstolen',null,{wit:[]});say('You swap it for a rock. He won\'t notice for hours.')}else{bad('He catches you. He just looks at you. Worse than a fight.');S.n.crumb.op-=20}go('talk','crumb')}]);}
    if(S.spouse)o.push([`Annul your marriage (${cost(100,'crumb')} teeth)`,()=>{if(pay(cost(100,'crumb'))){const x=S.spouse;S.n[x].loc='farm';S.f.spouseFate='annulled';S.spouse=null;S.n[x].op-=20;say(`Your union is declared "unbuttered". ${NPC[x].n} walks home.`)}go('talk','crumb')}]);
    o.push(['Confess your sins',()=>{quote(S.titles.length?`Crumb hears it all: ${S.titles.join(', ')}. "The Toaster forgives you. I don't."`:'Crumb: "That\'s barely a sin. Try harder."');go('talk','crumb')}]);return{t,o}},
  pell:()=>({t:alive('pig')?'"Bacon Prime is the last purebred pig in the wastes. I\'ve seen his papers. He ate them."':'Pell holds a little pig hat. He doesn\'t look up.',
    o:[alive('pig')?['"Sell me the pig."',()=>{quote('Pell: "Over my dead body." You hear a price.');go('talk','pell')}]:null,newsOpt('pell','"Pig\'s fine. That\'s all the news I need."')]}),
  pig:()=>({t:'Bacon Prime regards you like a minor aristocrat.',o:[['Pet him',()=>{if(roll(50))say('He allows it. You feel chosen.');else{bad('He bites. -2 HP.');if(hurt(2,'Bitten to death by a pig.'))return}go('talk','pig')}],
    [alive('pell')?`Steal him ${tag('steal',-15)}`:'Take him',()=>{if(!alive('pell')||chk('steal',-15)){S.dead.pig=1;S.f.pigStolen=1;give('pig');karma(-1);if(alive('pell'))event('stole','pell',{wit:[]});say('Into the sack. Heavy. Furious.');goHere()}else{bad('Pell sees you. Pitchfork.');fight([foe('pell')],{win:'back',back:['map']})}}]]}),
  nigel:()=>{const o=[],f=S.f;
    if(f.nigel)return{t:{hat:'Nigel waves. His hat glows faintly. "Still not eating chickens. Mostly."',dentist:'A sign: NIGEL, DENTIST. GLOWS BUT GENTLE.',lied:'Nigel is eating a chicken. "You didn\'t see this."',moved:'Nigel is doing the dead passengers\' teeth. "Great listeners."'}[f.nigel]||'Nigel glows.',o};
    o.push(['"What ARE you?"',()=>{f.nLore=1;quote('Nigel: "Ex-dentist. Glowing rock. Long story. My scalp glows so bright I can\'t sleep. A hat would change my life."');go('talk','nigel')}]);
    if(f.nLore&&(has('hat')||has('tophat')))o.push(['Give him a hat',()=>{has('hat')?take('hat'):take('tophat');f.nigel='hat';karma(2);event('helped','nigel');quote('Nigel weeps. "I can\'t see my own head." He hands you his dental savings.');gain(60);gainXP(75);go('talk','nigel')}]);
    o.push([`Talk him into moving out ${tag('speech',-10)}`,()=>{if(chk('speech',-10)){f.nigel='moved';S.n.nigel.loc='skybus';karma(1);gainXP(75);say('You sell him on the crashed plane. Quiet neighbours. He packs his chicken and goes.');goHere()}else{bad('"You just want me gone." He hugs his chicken.');go('talk','nigel')}}]);
    if(dumb())o.push(['"You glow. Glow bad?"',()=>{quote('Nigel: "Glow bad." You nod together. Best chat either of you has had in years.');go('talk','nigel')}]);
    return{t:f.nLore?'Nigel glows gently among the feathers.':'A green, glowing man holding half a chicken. "Please don\'t scream. Everyone screams."',o}},
  moe:()=>{const o=[];
    o.push([`Warm beer (${cost(3,'moe')})`,()=>{if(pay(cost(3,'moe'))){give('beer');say('Warm. Flat. Beer.')}go('talk','moe')}]);
    if(!S.armors.includes('jacket'))o.push([`Leather jacket, armour 2 (${cost(60,'moe')})`,()=>{if(pay(cost(60,'moe'))){S.armors.push('jacket');if(A[S.armor].dr<2)S.armor='jacket';say('Leather jacket. Smells like the last guy. (Equipped)')}go('talk','moe')}]);
    if(!S.f.hatBought)o.push([`A hat (${cost(15,'moe')})`,()=>{if(pay(cost(15,'moe'))){S.f.hatBought=1;give('hat');say('"It\'s mostly hat."')}go('talk','moe')}]);
    o.push(['"What\'s the word?"',()=>{quote('Moe: '+moeWord());go('talk','moe')}]);
    return{t:D('Moe wipes the same dirty glass he\'s wiped for thirty years.','Man. Glass. Dirty. You point. Moe nods. Friends.'),o}},
  mayor:()=>{const o=[],f=S.f;
    o.push(['Ask about the water',()=>{f.mWell=1;quote('Fenwick: "There was a free well. Filled up with corpses. Tragic. Nobody knows how." He winks.');go('talk','mayor')}]);
    if(f.mWell&&!f.pumpOpen)o.push([`Persuade him to open the pump ${tag('speech',-30)}`,()=>{if(chk('speech',-30)){f.pumpOpen=1;karma(4);addTitle('Bringer of Water');event('pump',null);gainXP(150);quote('You describe angry mobs. In detail. With diagrams. He opens the pump, hating every second.')}else bad('Fenwick: "Free water? Next you\'ll want free funerals."');go('talk','mayor')}]);
    if(!f.mayorJob&&alive('sheriff'))o.push(['"Any work?"',()=>{f.mayorJob=1;f.mayorJobDay=S.day;quote('Fenwick: "The Sheriff asks too many questions. 150 teeth if she has a gardening accident. Soon."');go('talk','mayor')}]);
    if(f.mayorJob&&!alive('sheriff')&&!f.mayorPaid&&!f.hitDone)o.push(['"The Sheriff is dead. Pay up."',()=>{f.mayorPaid=1;karma(-1);addTitle("Mayor's Butcher");gain(150);gainXP(100);quote('Fenwick: "Gardening. Dreadful business."');go('talk','mayor')}]);
    if(has('ledger')&&!f.blackmail)o.push(['Blackmail him with his ledger',()=>{f.blackmail=1;karma(-1);addTitle('Blackmailer');gain(150);gainXP(75);S.n.mayor.op-=40;quote('He sweats through his hat. 150 teeth.');go('talk','mayor')}]);
    if(!f.ledgerTaken)o.push([`Steal the ledger from his fridge desk ${tag('steal',-15)}`,()=>{if(chk('steal',-15)){f.ledgerTaken=1;give('ledger');say('Got it. Every corpse in the free well. Dates. Prices. Neat handwriting.');go('talk','mayor')}
      else{bad('"GUARDS!"');S.n.mayor.op=-100;fight([dep(),dep()],{win:'back',back:['map']})}}]);
    if(!has('tophat')&&!f.hatTaken)o.push([`Lift his top hat ${tag('steal',-25)}`,()=>{if(chk('steal',-25)){f.hatTaken=1;give('tophat');say('He blames a bird.')}else bad('"Hands where I can see them."');go('talk','mayor')}]);
    if(S.stats.brains>=8&&f.mayorTribute&&!f.tributeSpotted)o.push(['[Brains] "Funny how the Molars skipped your office."',()=>{f.tributeSpotted=1;S.n.mayor.op-=20;gain(60);quote('Fenwick goes white and slides 60 teeth across the fridge. "Let\'s keep that between friends."');go('talk','mayor')}]);
    return{t:f.pumpOpen?'Fenwick sulks behind his fridge desk.':'Soft man, hard top hat, desk made from a fridge. "Thirsty, citizen?"',o}},
  sheriff:()=>{const o=[],f=S.f;
    o.push(['Ask about the Mayor',()=>{quote('Crane: "He poisoned the free well to sell us water. Get me his ledger. Then he swings."');go('talk','sheriff')}]);
    if(has('ledger'))o.push(['Hand over the ledger',()=>{take('ledger');f.ledgerGiven=1;if(alive('mayor')){f.hanged=1;S.dead.mayor=1;karma(4);addTitle('Hero of Rustwater');event('hanged','mayor');quote('By sundown Fenwick hangs from his own pump. The water runs free.')}else quote('Crane: "Already dead? Saves rope."');gain(100);gainXP(150);go('talk','sheriff')}]);
    if(!f.krugBounty)o.push(['"Any bounties?"',()=>{f.krugBounty=1;quote('Crane: "Krug, the slaver. 100 teeth if he turns up dead."');go('talk','sheriff')}]);
    if(f.krugBounty&&!alive('krug')&&!f.krugPaid1)o.push(['Claim the Krug bounty',()=>{f.krugPaid1=1;gain(100);gainXP(100);go('talk','sheriff')}]);
    if(f.knowRaid&&!f.warned&&!f.raid)o.push(['Warn her: the Molars are coming',()=>{f.warned=1;S.n.sheriff.op+=15;gainXP(50);quote('Crane: "Then we\'ll be ready." She starts handing out rifles.');go('talk','sheriff')}]);
    if(f.knowSilo&&!f.kingStopped&&!f.sheriffAlly)o.push([`Ask her to ride with you to Silo 9${S.n.sheriff.op>=40?'':' (needs her trust)'}`,()=>{if(S.n.sheriff.op>=40){f.sheriffAlly=1;quote('Crane checks her rifle. "About time someone did." She\'ll join you at the silo.')}else quote('Crane: "I don\'t trust you that much."');go('talk','sheriff')}]);
    if(S.n.sheriff.op>=60&&!S.armors.includes('vest'))o.push(['"Got any spare armour?"',()=>{S.armors.push('vest');quote('Crane tosses you her old vest. "It\'s sentimental. Don\'t get shot in it."');go('talk','sheriff')}]);
    o.push(newsOpt('sheriff','"Quiet. I hate quiet."'));return{t:'Sheriff Crane. Has shot a lot of people. Regrets maybe two.',o}},
  doc:()=>{const o=[],c=b=>cost(b,'doc');
    o.push([`Heal fully (${c(30)})`,()=>{if(pay(c(30))){heal(S.maxhp);say('Fishing line and enthusiasm. Good as new.')}go('talk','doc')}]);
    o.push([`Gut Glue (${c(25)})`,()=>{if(pay(c(25)))give('gutglue');go('talk','doc')}]);
    o.push([`Buzz (${c(20)})`,()=>{if(pay(c(20)))give('buzz');go('talk','doc')}]);
    if(S.addicted)o.push([`Cure your Buzz habit (${c(50)})`,()=>{if(pay(c(50))){S.addicted=false;say('A day strapped to a chair while he yells at you. Clean.')}go('talk','doc')}]);
    if(S.f.rash)o.push([`Cure the rash (${c(40)})`,()=>{if(pay(c(40))){S.f.rash=0;S.maxhp+=5;say('A cream made of dead lizard. It works.')}go('talk','doc')}]);
    if(!S.f.coilGot&&!has('coil'))o.push([`Heating coil (${c(60)})`,()=>{if(pay(c(60))){give('coil');S.f.coilGot=1}go('talk','doc')}]);
    if(has('toaster'))o.push(['Sell him the Holy Toaster (80)',()=>{take('toaster');S.f.toasterSold=1;gain(80);quote('Doc: "For science." You don\'t ask which science.');go('talk','doc')}]);
    if(!S.f.brainJuice)o.push(['Drink his Brain Juice (he pays 30)',()=>{S.f.brainJuice=1;gain(30);if(roll(S.stats.luck*7+20)){const was=dumb();S.stats.brains+=3;S.skills.speech+=10;S.skills.science+=10;say(was?'Words arrive. Lots of them. You realise you\'ve been an idiot your whole life. (+3 Brains)':'Your thoughts get sharper. (+3 Brains, +10 Speech and Science)')}else{S.maxhp-=5;S.hp=Math.min(S.hp,S.maxhp);bad('You can taste colours now. Mostly beige. -5 max HP.')}go('talk','doc')}]);
    if(!S.f.kidney)o.push(['Sell him a kidney (+90 teeth, -8 max HP)',()=>{S.f.kidney=1;S.maxhp-=8;S.hp=Math.min(S.hp,S.maxhp);gain(90);quote('Doc: "You had two! Greedy."');go('talk','doc')}]);
    if(S.stats.brains>=7&&!S.f.docFix)o.push(['[Brains] Correct his chemistry',()=>{S.f.docFix=1;give('buzz',2);S.n.doc.op+=20;quote('Doc: "...That\'s why they kept exploding." He gives you 2 Buzz.');go('talk','doc')}]);
    o.push([`Steal some Buzz ${tag('steal',-10)}`,()=>{if(chk('steal',-10)){give('buzz',2);say('Two hits of Buzz, pocketed.')}else{bad('He throws a jar of something. It\'s still moving. -4 HP.');S.n.doc.op-=20;if(hurt(4,'Killed by a thrown jar of something.'))return}go('talk','doc')}]);
    return{t:'Doc Ratchet. His degree is a cereal box with DOCTOR on it. "What\'s broken, besides your spirit?"',o}},
  opal:()=>{const o=[],f=S.f;
    o.push([`Pay for company (${cost(30,'opal')})`,()=>{if(!pay(cost(30,'opal')))return go('talk','opal');
      say(dumb()?'You tell Gloria about your favourite rocks for an hour. She says it\'s her best night in years. You feel wonderful.':pick(['An hour with Gloria, who laughs like a cement mixer. You come out missing a sock.','An hour with Rex, who calls you "partner" and smells of gun oil and cinnamon.']));heal(10);
      if(!perk('gut')&&!f.rash&&!roll(S.stats.luck*8+30)){f.rash=1;S.maxhp-=5;S.hp=Math.min(S.hp,S.maxhp);bad('It itches. Wasteland Rash. -5 max HP until Doc fixes it.')}go('talk','opal')}]);
    if(!f.opalJob)o.push(['"Any work?"',()=>{f.opalJob=1;quote('Opal: "Krug took my sister. Sold her twice. Bring me his death and I\'ll pay 150."');go('talk','opal')}]);
    if(f.opalJob&&!alive('krug')&&!f.opalPaid)o.push(['"Krug is dead."',()=>{f.opalPaid=1;karma(1);gain(150);gainXP(100);if(f.krugPaid1)addTitle('Paid Twice for One Corpse');quote('Opal pours two drinks. "To my sister."');go('talk','opal')}]);
    o.push(newsOpt('opal','"Nothing I\'d repeat for free."'));return{t:'The Velvet Rad. Madame Opal: warm smile, shotgun under the counter. "Everything costs, sugar. Including looking."',o}},
  jeb:()=>{const o=[],f=S.f,c=cost(300,'jeb');
    if(!f.jebQ)o.push(['"Need anything?"',()=>{f.jebQ=1;quote('Jeb: "Two guards, Pete and Sal, went to Mama Lou\'s for lunch. Never came back. 100 teeth to find out."');go('talk','jeb')}]);
    if(f.jebQ&&!f.jebPaid&&alive('pete')&&S.n.pete.loc==='rustwater')o.push(['"Pete\'s back."',()=>{f.jebPaid=1;karma(2);gain(100);gainXP(100);quote('Jeb: "And Sal?" Pete: "Sal was the soup of the day."');go('talk','jeb')}]);
    if(f.jebQ&&!f.jebPaid&&has('badge')&&(!alive('pete')||S.n.pete.loc==='cage'))o.push(['Show him the badges',()=>{take('badge');f.jebPaid=1;gain(40);gainXP(50);S.n.lou.op-=10;quote('Jeb: "Lou\'s. Should\'ve known. Her stew always tasted like somebody."');go('talk','jeb')}]);
    o.push([`Ride the caravan east, forever (${f.jebCheap?Math.round(c/2):c} teeth)`,()=>{if(pay(f.jebCheap?Math.round(c/2):c)){S.end={type:'caravan'};go('ending')}else go('talk','jeb')},'danger']);
    if(!f.haggle)o.push([`Haggle ${tag('speech',-15)}`,()=>{f.haggle=1;if(chk('speech',-15)){f.jebCheap=1;quote('Jeb: "Half price. You ride with the lizards."')}else quote('Jeb: "Full price. The lizards pay full price."');go('talk','jeb')}]);
    o.push(newsOpt('jeb','"Roads are quiet. Too quiet. I hate saying that."'));return{t:'Caravan Jeb. Six pack-lizards and a cart. Heading east, past the mountains. "They say it\'s green."',o}},
  pete:()=>({t:alive('pete')&&S.n.pete.loc==='rustwater'?'Pete, alive. "I\'m never eating meat again."':'Pete.',o:[newsOpt('pete','"I still dream about the hooks."')]}),
  teo:()=>({t:S.n.teo.loc==='rustwater'?'Old Teo. Free. Still broke. Smiling anyway.':'Old Teo has named all the trolleys in his pen.',o:[
    ['"How did you end up here?"',()=>{quote('Teo: "Sold myself. Three meals a day, no rent. Turns out the rent is your whole life."');go('talk','teo')}],
    ['"Who buys from Krug?"',()=>{learnSilo();quote('Teo: "The Dentist King. Silo 9, east. He works diggers to death down there. Digging for something big."');go('talk','teo')}]]}),
  hector:()=>{const f=S.f,o=[];
    if(knows('hector','sold','bess')&&S.n.bess.loc==='pen'&&!f.bessQ)return{t:'"Jeb says you sold my Bess to Krug." The shotgun isn\'t pointed at you. Yet.',o:[
      ['"I\'ll bring her back."',()=>{f.bessQ=1;S.n.hector.op=Math.max(S.n.hector.op,-30);gain(100);quote('Hector: "Then go. Here\'s 100 teeth to buy her back. Krug sells on after a few days."');go('talk','hector')}],
      [`"Jeb\'s lying." ${tag('speech',-25)}`,()=>{if(chk('speech',-25)){S.n.hector.op=Math.max(S.n.hector.op,-20);quote('Hector: "...Jeb does drink." The gun goes down. For now.');go('talk','hector')}else{bad('Hector: "Liar."');S.n.hector.op=-100;fight([foe('hector')],{win:'back',back:['map']})}}]]};
    let t='"What." Hector doesn\'t do questions.';
    if(f.bessHome&&alive('bess'))t='"You brought her home. I still want to shoot you. Less, though."';
    else if(f.bessQ&&S.n.bess.loc==='pen')t='"Well? Where is she?"';
    o.push(['Ask about his kids',()=>{quote('Hector: "Bess is 29, Bert is 31. Neither leaves this farm. Not since the Hendersons went to Lou\'s for dinner and became dinner."');go('talk','hector')}]);
    if(!S.weapons.includes('shotgun'))o.push([`Buy his shotgun (${cost(200,'hector')})`,()=>{if(pay(cost(200,'hector'))){S.weapons.push('shotgun');quote('Hector: "Treat her right." He goes inside to cry.')}go('talk','hector')}]);
    o.push(newsOpt('hector','"Jeb tells me things. Today he told me nothing."'));return{t,o}},
  bess:()=>{const n=S.n.bess,f=S.f;if(n.loc==='pen')return penTalk('bess');
    const sold=knows('bess','sold','bess');const o=[['Chat',()=>{quote(sold?'Bess: "Krug fed us once a day. I thought about you every meal."':'Bess: "Daddy says outside is full of killers. It sounds amazing."');go('talk','bess')}]];
    if(!S.spouse&&!f.spouseFate&&!sold)o.push([`Flirt ${tag('speech',-5)}`,()=>flirt('bess')]);
    return{t:sold?'"You sold me." She keeps sharpening her hoe. She looks at you while she does it.':'Bess, 29, has been "about to leave" for eleven years. Sharpening a hoe that doesn\'t need it.',o}},
  bert:()=>{const n=S.n.bert,f=S.f;if(n.loc==='pen')return penTalk('bert');
    const o=[['Chat',()=>{quote('Bert: "A tractor can pull eight times its own weight." You know that now. Forever.');go('talk','bert')}]];
    if(!S.spouse&&!f.spouseFate)o.push([`Flirt ${tag('speech',-5)}`,()=>flirt('bert')]);
    return{t:'Bert, 31, has read the same tractor magazine every night of his adult life.',o}},
  lou:()=>{const o=[],f=S.f;
    if(!f.louAsk)o.push([`Ask about two missing caravan guards ${tag('speech',-10)}`,()=>{f.louAsk=1;quote(chk('speech',-10)?'Lou: "Pete and Sal? Lovely boys. Sal was so tender..." She stops. "Never seen \'em. More stew?"':'Lou: "Never seen \'em, honey. More stew?" Junior stops chopping.');go('talk','lou')}]);
    if(!f.louConfront)o.push(['"I know what\'s in the stew."',()=>{f.louConfront=1;go('confront')}]);
    if(f.louFriend||f.cannibal)o.push(['"Got any work?"',()=>{quote('Lou: "Fresh meat, sweetie. Pigs, people. I pay well."');go('talk','lou')}]);
    if(has('pig'))o.push([`Sell her Bacon Prime (${perk('butcher')?80:40})`,()=>{take('pig');f.pigFate='stew';gain(perk('butcher')?80:40);quote('Lou: "Pedigree. You can taste a pedigree."');go('talk','lou')}]);
    if(S.spouse)o.push([`Sell your spouse, ${NPC[S.spouse].n}, for stew (${perk('butcher')?400:200})`,()=>sellSpouse('lou'),'danger']);
    return{t:f.louReformed?'Lou winks. The menu says MOLE-DOG STEW now. Probably.':'Mama Lou, built like a fridge. "Sit down, honey. You look delicious. Hungry! You look hungry."',o}},
  junior:()=>({t:'Junior, 44, built like a bigger fridge. He grunts and keeps chopping.',o:[]}),
  krug:()=>{const o=[],f=S.f;
    if(S.spouse)o.push([`Sell your spouse, ${NPC[S.spouse].n} (${perk('butcher')?600:300})`,()=>sellSpouse('krug'),'danger']);
    ['bess','bert'].forEach(x=>{if(alive(x)&&S.n[x].loc==='pen')o.push([`Buy back ${NPC[x].n} (${cost(400,'krug')})`,()=>{if(pay(cost(400,'krug'))){quote('Krug: "Returns policy. Restocking fee is fifty percent. Kidding. It\'s included."');go('freed1',x)}else go('talk','krug')}])});
    if(has('pig'))o.push(['Sell him Bacon Prime',()=>{take('pig');f.pigFate='slave';gain(10);quote('Krug laughs till he cries. "Ten teeth. He can pull a cart."');go('talk','krug')}]);
    if(!f.slaver)o.push([f.soldSomeone?'"I want in."':'"I want in." (sell someone, or pay 100)',()=>{if(f.soldSomeone)tattoo();else if(pay(100))tattoo();else go('talk','krug')}]);
    o.push(['"Who buys your diggers?"',()=>{learnSilo();quote('Krug: "The Dentist King. Silo 9, out east. He pays in teeth. Digging for something big."');go('talk','krug')}]);
    o.push(['Sell yourself',()=>{S.end={type:'sold'};go('ending')},'danger']);
    return{t:f.slaver?'"Colleague! How\'s the ink healing?"':'Krug. Huge, polite, immaculate records. "Everything has a price. Mostly people."',o}}
};
function moeWord(){const f=S.f;
  if(S.day>=6&&!f.knowSilo&&roll(60)){learnSilo();return '"Molars. Raiders in tooth necklaces. They come from an old silo out east, past the plane."'}
  if(S.day>=8&&!f.raid&&!f.knowRaid&&!f.kingStopped){f.knowRaid=1;return '"Molars are sniffing round town, counting our guns. Something\'s coming. Soon."'}
  const n=news('moe',null);if(n&&roll(70))return n.replace('"Heard','"Word is');
  return pick(['"Lou\'s stew is the best in the wastes. Nobody asks what\'s in it."','"The Mayor keeps a ledger in his fridge desk. Next to his feelings."','"Krug buys anything that walks. Opal wants him dead."','"There\'s a dead plane out east. Very quiet passengers."','"Doc pays you to drink his stuff. Last guy can hear the colour blue."'])}
SC.confront=()=>show({title:"Mama Lou's",icon:'🍲',text:'Lou keeps wiping the counter. "Everybody knows, sweetie. Nobody asks. That\'s the deal." Junior cracks his knuckles. All of them.',opts:[
  ['"I want in."',()=>{S.f.louFriend=1;addTitle('Friend of Mama Lou');karma(-2);S.n.lou.op+=30;S.n.junior.op+=30;quote('Lou: "I knew I liked you! You eat free, forever."');go('hub','diner')}],
  [`Make her stop serving people ${S.stats.brawn>=9?'[Brawn]':tag('speech',-15)}`,()=>{if(S.stats.brawn>=9||chk('speech',-15)){S.f.louReformed=1;karma(3);gainXP(150);addTitle('Reformer of Cannibals');say(S.stats.brawn>=9?'You hold Junior over the stew pot. Lou agrees to switch to mole-dog.':'Repeat business, you explain. Dead customers don\'t come back. She sighs and switches to mole-dog.');go('hub','diner')}
    else{bad('"Nobody tells Mama Lou what to cook."');fight(crew('lou'),{win:'kitchenwin',back:['map']})}}],
  ['Fight them both',()=>fight(crew('lou'),{started:true,win:'kitchenwin',back:['map']}),'danger'],['"Never mind. Great stew."',()=>go('hub','diner')]]});

// ================= SILO 9 =================
function kingFight(){const en=[foe('king')];if(!S.f.pitFreed)en.push(mkE('Molar elite','🦷',7,{wep:'molargun'}),mkE('Molar elite','🦷',7,{arm:'spikes'}));
  if(S.f.sheriffAlly&&alive('sheriff'))say('Sheriff Crane kicks the door in behind you.');fight(en,{started:true,win:'go',args:['console'],allies:S.f.sheriffAlly?['sheriff']:[]})}
SC.throne=()=>{const f=S.f;if(!alive('king'))return go('console');
  if(f.sabotaged&&!f.kingTried){f.kingTried=1;quote('The King slams a big red button. Nothing. Again. Nothing. He turns to you, very slowly.')}
  show({title:'The Dentist King',icon:'🦷',sub:`Lv ${lvl('king')}`,text:'A pre-war dentist\'s coat. A crown of other people\'s teeth. "The world has a rotten tooth. I\'m going to pull it."',opts:[
    ['"Why?"',()=>{quote('King: "Two hundred years of rot. One clean extraction. Then something new can grow."');go('throne')}],
    !f.kingStopped?[`Talk him down ${tag('speech',-35)}`,()=>{if(chk('speech',-35)){stopKing('talked');give('key');quote('An hour about his mother. About flossing. He sits down and cries, and hands you the launch key.');go('console')}else{bad('King: "You sound like my patients."');kingFight()}}]:null,
    !f.kingStopped&&S.stats.brains>=8?[`[Brains] "It launches from HERE. You're ground zero." ${tag('speech',10)}`,()=>{if(chk('speech',10)){stopKing('talked');give('key');quote('He goes very pale. He had not considered that. He hands you the key.');go('console')}else{bad('He doesn\'t follow the maths.');kingFight()}}]:null,
    !f.kingStopped?[`Lift the launch key off his neck ${tag('steal',-30)}`,()=>{if(chk('steal',-30)){stopKing('stolen');give('key');quote('You lift the key mid-monologue. He keeps monologuing.');go('throne')}else{bad('King: "Rude."');kingFight()}}]:null,
    !f.kingStopped?['"Let me push the button."',()=>go('launch','king'),'danger']:null,
    ['Fight him',()=>kingFight(),'danger'],['Back',()=>go('hub','silo')]]})};
SC.console=()=>{const f=S.f;const o=[];
  if(!f.disarmed&&!f.launched)o.push(['Disarm the Big Tooth for good',()=>{f.disarmed=1;stopKing(f.kingHow||'killed');addTitle('Saviour Nobody Will Believe');gainXP(200);say('You pull every wire. The hum dies. The world will never know.');go('console')}]);
  if(!f.disarmed&&!f.launched&&(has('key')||!alive('king')))o.push(['Launch it yourself',()=>go('launch','you'),'danger']);
  o.push(['Back',()=>go('hub','silo')]);
  show({title:'Launch console',icon:'🚀',text:f.disarmed?'Dead wires. A dead missile. A world that has no idea.':f.launched?'The silo is empty. Somewhere, a crater glows.':'A big red button and a map of the wasteland with every town circled.',opts:o})};
SC.launch=who=>{const t=Object.keys(LOC).filter(k=>!LOC[k].sub&&k!=='silo'&&!S.crater[k]);
  show({title:'Choose a target',icon:'☢️',text:who==='king'?'The King hands you the key, beaming. "You pick. It\'s your gift."':'Your finger over the button. Who goes?',opts:[
    ...t.map(k=>[`Nuke ${LOC[k].n}`,()=>nuke(k,who),'danger']),['EVERYTHING',()=>{S.end={type:'destroyer'};go('ending')},'danger'],['Don\'t',()=>go(who==='king'?'throne':'console')]]})};
function nuke(k,who){const f=S.f;f.launched=1;f.kingStopped=1;f.kingHow=f.kingHow||'launched';f.nukedLoc=k;S.crater[k]=1;karma(-20);addTitle(`Destroyer of ${LOC[k].n}`);
  let c=0;IDS.forEach(x=>{if(alive(x)&&(S.n[x].loc===k||(k==='chainfield'&&S.n[x].loc==='pen')||(k==='scrapwell'&&S.n[x].loc==='well'))){S.dead[x]=1;c++}});S.kills+=c+(k==='rustwater'?200:30);
  if(who==='king')addTitle('Heir to the Dentist King');
  event('nuked',null,{all:true,tgt:k,loc:'silo'});
  if(k==='scrapwell'){S.end={type:'nukehome'};return go('ending')}
  bad(`The Big Tooth rises. ${LOC[k].n} is gone. Everyone there. Everyone.`);go('hub','silo')}

// ================= CHARACTER =================
SC.char=()=>{const st=S.stats,sk=S.skills,o=[];
  if(S.perkPend>0){if(!S.perkOpts||!S.perkOpts.length)S.perkOpts=shuffle(Object.keys(PERKS).filter(p=>!S.perks.includes(p))).slice(0,3);
    S.perkOpts.forEach(p=>o.push([`PERK: ${PERKS[p].n}. ${PERKS[p].d}`,()=>{S.perks.push(p);S.perkPend--;S.perkOpts=null;say(`Perk taken: ${PERKS[p].n}.`);go('char')}]))}
  if(S.pts>0)['melee','guns','sneak','steal','speech','science'].forEach(k=>o.push([`+${Math.min(5,S.pts)} ${cap(k)} (now ${sk[k]})`,()=>{const a=Math.min(5,S.pts);sk[k]+=a;S.pts-=a;go('char')}]));
  S.weapons.filter(w=>w!==S.weapon).forEach(w=>o.push([`Wield ${W[w].n} (${W[w].t}, ${W[w].d[0]}-${W[w].d[1]})`,()=>{S.weapon=w;go('char')}]));
  S.armors.filter(a=>a!==S.armor).forEach(a=>o.push([`Wear ${A[a].n} (armour ${A[a].dr}${A[a].tw?', twitch '+A[a].tw:''})`,()=>{S.armor=a;go('char')}]));
  if(has('gutglue')&&S.hp<S.maxhp)o.push(['Use Gut Glue (+20)',()=>{take('gutglue');say(`+${heal(20)} HP.`);go('char')}]);
  if(has('meat')&&S.hp<S.maxhp)o.push(['Eat questionable meat (+8)',()=>{take('meat');say(`+${heal(8)} HP. Don't wonder.`);go('char')}]);
  if(has('beer')&&S.hp<S.maxhp)o.push(['Drink warm beer (+3)',()=>{take('beer');say(`+${heal(3)} HP.`);go('char')}]);
  if(S.spouse)o.push([`Murder your spouse, ${NPC[S.spouse].n}`,()=>{const r=S.ret||{scene:'map',args:[]};fight([foe(S.spouse)],{started:true,win:'go',args:[r.scene,...r.args]})},'danger']);
  o.push(['Close',()=>{const r=S.ret||{scene:'map',args:[]};go(r.scene,...r.args)}]);
  const items=Object.keys(S.inv).filter(k=>S.inv[k]>0).map(k=>`${ITEMS[k]||k}${S.inv[k]>1?' x'+S.inv[k]:''}`);
  show({title:`${S.name}, ${PRESETS[S.preset].title}`,icon:'🧍',sub:`Level ${S.level} · ${S.pts} skill points · Day ${S.day} · ${S.kills} kills`,
    text:`Brawn ${st.brawn}  Eyes ${st.eyes}  Guts ${st.guts}  Charm ${st.charm}  Brains ${st.brains}  Twitch ${ptw()}  Luck ${st.luck}
Melee ${sk.melee}  Guns ${sk.guns}  Sneak ${sk.sneak}  Steal ${sk.steal}  Speech ${sk.speech}  Science ${sk.science}
Perks: ${S.perks.length?S.perks.map(p=>PERKS[p].n).join(', '):'none'}
Carrying: ${items.join(', ')||'regret'}
Reputation: ${karmaTitle()}${S.titles.length?' · '+S.titles.join(' · '):''}${S.addicted?' · ADDICTED':''}${S.f.rash?' · RASH':''}`,opts:o});
};

// ================= TITLE / INTRO / ENDING =================
SC.title=()=>show({title:'DUST & TEETH',icon:'🦷',sub:'a nasty little wasteland',text:'The bombs fell 200 years ago. You\'re a nobody from Scrapwell. No quest. No prophecy. Teeth for money.\n\nEveryone remembers what you do, and word gets around. Somewhere out east, something is waking up.\n\nNo reloads. Who are you?',
  opts:Object.keys(PRESETS).map(k=>[`${PRESETS[k].name}, ${PRESETS[k].title}. ${PRESETS[k].desc}`,()=>{newGame(k);go('intro')}])});
SC.intro=()=>show({title:'Scrapwell',icon:'🏚️',text:D('You step past the fence. Nobody needs you. Best thing about being nobody.','Fence. You go past it. All by yourself. Head feels big.'),opts:[['Go',()=>go('hub','scrapwell')]]});
SC.ending=()=>{const E=S.end,f=S.f,L=[];const al=x=>!S.dead[x];
  const head={elder:'You killed Ma Thistle. Her last words: "I knew it would be you. The knives are under the goat."',death:`YOU DIED. ${E.cause||''}`,
    caravan:'You ride east with Jeb. It\'s greenish over there. Nobody knows what you did.'+(f.kingStopped?'':' Behind you, the sky turns white. You don\'t look back.'),
    sold:'You sell yourself to Krug for twelve teeth and a blanket. You carry rocks for nineteen years.'+(f.kingStopped?'':' Then the sky turns white.'),
    retired:'You sit down in your shack and never get up. You get a goat.'+(f.kingStopped?'':' One morning the sky turns white. The goat goes first.'),
    nuke:f.knowSilo?'Day 25. The Big Tooth launches. You knew where it was. You didn\'t get there in time.':'Day 25. The sky turns white. You never even found out where it came from.',
    destroyer:'You push the button for EVERYTHING. The Dentist King weeps with joy. The world goes white. You were a nobody. Now you\'re the last thing anyone saw.',
    nukehome:'You nuked Scrapwell. Your own home. Your own well. Even the King looks at you funny.'}[E.type];
  if(E.type!=='nuke'&&E.type!=='destroyer'){
    L.push(!al('elder')?'Without Ma Thistle, Scrapwell fought over her chair until there was no village left.':f.tfixed?'The Holy Toaster pops once a year now. You\'re in the stained glass, holding a fork.':'Scrapwell kept dying slowly, with good manners.');
    if(f.nigel)L.push({dentist:'Nigel became Scrapwell\'s glowing dentist. Gentle hands.',hat:'Nigel lived under his hat, eating chickens only on Tuesdays.',lied:'Nigel kept eating a chicken a week. Gus blamed foxes. There are no foxes.',moved:'Nigel lived happily in the Sky-Bus, doing dead men\'s teeth.',dead:'Nobody missed Nigel. The chickens held no service.'}[f.nigel]);
    if(f.pigFate==='stew')L.push('Bacon Prime was Thursday\'s special. "Aristocratic, with notes of grief."');else if(f.pigFate==='slave')L.push('Bacon Prime pulled Krug\'s cart, escaped, and now leads a wild pig gang. He remembers your face.');
    if(f.nukedLoc)L.push(`${LOC[f.nukedLoc].n} is a glowing crater. You chose that.`);
    else if(f.hanged)L.push('The Mayor swung from his own pump. Rustwater\'s water stayed free for a generation.');else if(f.pumpOpen)L.push('Fenwick kept the pump open and told everyone it was his idea.');
    else if(!al('sheriff')&&al('mayor'))L.push('With the Sheriff dead, water hit 20 teeth a cup. Funerals stayed free and popular.');else L.push('Rustwater stayed thirsty.');
    if(f.raidResult==='held')L.push('Rustwater still tells the story of the night it beat the Molars.');
    if(f.louReformed&&al('lou'))L.push('Mama Lou switched to mole-dog. Nobody could say why it tasted worse.');else if(al('lou'))L.push(f.cannibal?'Lou always saved you a bowl. You always ate it.':'Travellers kept vanishing at Lou\'s. Nobody asked.');
    if(al('pete')&&S.n.pete.loc==='rustwater')L.push('Pete never ate meat again. Every Tuesday he lit a candle for Sal.');else if(f.peteEaten)L.push('Pete was served on Tuesday, as planned.');
    L.push(f.freed?'The freed people of Chainfield built a town from shopping trolleys. There\'s a statue of you. It\'s bad, but sincere.':!al('krug')?'Without Krug, his slavers fought over the notebook until none were left.':f.slaver?'You stayed in Krug\'s notebook as a valued colleague.':'Krug kept perfect records for many more years.');
    const b=S.n.bess;
    if(!al('bess'))L.push(f.queenFate==='killed'?'You killed the Raider Queen. Nobody knew she\'d been a farm girl you sold.':f.spouseFate==='stew'&&f.spouseWho==='bess'?'Bess was Thursday\'s special.':'Bess is dead. Hector never stopped hunting you.');
    else if(b.loc==='party')L.push(f.reunited?'Bess stayed with you. She held the knife from then on.':'Bess stayed by your side. Not a good marriage, but a long one.');
    else if(b.loc==='wastes')L.push(f.queenFate==='spared'||f.queenFate==='paid'?'Raider Queen Bess rules the eastern roads. Travellers who say your name get robbed twice.':'Somewhere out there, Raider Queen Bess is still looking for you.');
    else if(b.loc==='gone'||b.loc==='pen')L.push('Bess was sold on. Nobody knows where.');
    else if(f.bessHome)L.push('Bess came home from Chainfield. She sleeps with the hoe now.');
    if(al('bert')&&(S.n.bert.loc==='gone'||S.n.bert.loc==='pen'))L.push('Bert was sold to a farm out west. He finally drives a real tractor. He calls it a happy ending.');
    L.push(f.kingHow==='talked'?'The Dentist King retired and opened a practice in Rustwater. Fair prices. The chairs have straps.':f.disarmed||f.kingHow==='sabotage'||f.kingHow==='stolen'?'The Big Tooth never launched. Nobody ever knew how close it came. You know.':f.kingStopped?'':'Out east, the Big Tooth was still waking up.');
  }
  const you=`${S.level>1?'Level '+S.level+'. ':''}${S.day} days. ${S.kills} kills. ${S.teeth} teeth.\nKnown as: ${karmaTitle()}${S.titles.length?'. '+S.titles.join('. '):''}.`;
  const text=`${head}\n\n${L.filter(Boolean).join('\n')}\n\n${you}\n\nThis life is over. Your save is gone.`;
  wipe();S=null;show({title:'The End',icon:'💀',text,opts:[['Start a new life',()=>go('title')]]});
};
function hud(){const h=$('hud');if(!S){h.innerHTML='<b>DUST &amp; TEETH</b>';return}
  const lo=xpFor(S.level),hi=xpFor(S.level+1),xp=S.level>=12?100:clamp((S.xp-lo)*100/(hi-lo),0,100);
  h.innerHTML=`<b>${esc(S.name)} · Lv ${S.level}</b><div><div class="bl">HP ${S.hp}/${S.maxhp}</div><div class="bar hp"><i style="width:${clamp(S.hp*100/S.maxhp,0,100)}%"></i></div></div><div><div class="bl">XP ${S.xp}${S.level<12?'/'+hi:''}</div><div class="bar xp"><i style="width:${xp}%"></i></div></div><div id="hudx"><span>🦷 ${S.teeth}</span><span>☀️ Day ${S.day}</span><span>🛡️ ${A[S.armor].n}</span><span>⚔️ ${W[S.weapon].n}</span><span>${karmaTitle()}</span>${S.spouse?`<span>💍 ${NPC[S.spouse].n}</span>`:''}${S.pts||S.perkPend?'<span class="bang">▲ Level up! Open Character</span>':''}${S.addicted?'<span class="bang">Addicted</span>':''}</div>`}
(function boot(){const s=load();
  if(s&&!s.end&&s.scene&&SC[s.scene]&&s.n){S=s;if(S.scene==='fight'&&!S.fight){S.scene='hub';S.args=[S.here||'scrapwell']}go(S.scene,...(S.args||[]))}else go('title')})();
</script>
