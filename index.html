<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dust & Teeth</title>
<style>
:root{--a:#ffb000;--dim:#8a5f00;--bg:#0c0904;--panel:#16110a;--red:#ff6a4d;--grn:#a8e07c;--blue:#7cc4e0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--a);font-family:"Courier New",ui-monospace,Menlo,monospace;font-size:16px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
#wrap{max-width:860px;margin:0 auto;padding:10px 14px 60px}
#hud{position:sticky;top:0;z-index:3;background:var(--bg);border:1px solid var(--dim);padding:8px 10px;display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 14px;align-items:center;font-size:13px}
.bar{height:10px;border:1px solid var(--dim);position:relative;background:#000}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--a)}
.bar.hp>i{background:var(--red)}.bar.xp>i{background:var(--blue)}
.bl{font-size:11px;color:var(--dim);margin-bottom:2px}
#hudx{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px}
#head{display:flex;align-items:center;gap:10px;margin:16px 0 6px;min-height:10px}
#head .ic{font-size:30px;filter:sepia(.6) saturate(1.6)}
#head h1{font-size:19px;margin:0;letter-spacing:1px}
#head .sub{font-size:12px;color:var(--dim)}
#log p{margin:0 0 5px;line-height:1.4;font-size:14px}
#log .m{color:var(--grn)}#log .b{color:var(--red)}#log .q{color:#ffd480}
#text{line-height:1.5;margin:8px 0 10px;white-space:pre-wrap}
#cards{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.card{border:1px solid var(--dim);background:var(--panel);padding:6px 8px;min-width:118px;cursor:pointer;color:var(--a);font:inherit;text-align:left}
.card:hover,.card.sel{border-color:var(--a);background:#21180b}
.card .ci{font-size:24px;filter:sepia(.5) saturate(1.5)}
.card .cn{font-size:13px;font-weight:bold}
.card .cs{font-size:11px;color:var(--dim)}
.card .bar{margin-top:4px;height:7px}
.card.dead{opacity:.35;cursor:default}
.bang{color:var(--red);font-weight:bold}
#map{position:relative;width:100%;aspect-ratio:16/9;border:1px solid var(--dim);background:radial-gradient(circle at 50% 50%,#2a1c08,#0f0b05);margin:6px 0 10px}
#map svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--a);color:var(--a);font:inherit;font-size:12px;padding:4px 6px;cursor:pointer;text-align:center;line-height:1.2;white-space:nowrap}
.node:hover{background:#2a1c08}
.node .ni{font-size:20px;display:block}
.node .nl{font-size:10px;color:var(--dim);display:block}
.node.here{border-color:var(--grn);color:var(--grn)}
#opts{border-top:1px dashed var(--dim);padding-top:8px}
#opts button{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--a);font:inherit;padding:6px 8px;cursor:pointer;line-height:1.35}
#opts button:hover,#opts button:focus-visible{border-color:var(--a);background:rgba(255,176,0,.07);outline:none}
#opts .n{color:var(--dim);margin-right:6px}
#opts button.danger{color:var(--red)}
#foot{margin-top:18px;color:var(--dim);font-size:11px}
@media (max-width:560px){#hud{grid-template-columns:1fr 1fr}#hud>b{grid-column:1/-1}.node{font-size:10px;padding:2px 4px}.node .ni{font-size:16px}}
</style>
</head>
<body>
<div id="wrap"><div id="hud"></div><div id="head"></div><div id="log"></div><div id="text"></div><div id="cards"></div><div id="map" hidden></div><div id="opts"></div>
<div id="foot">Keys 1 to 9 pick options. Click people to talk. Everyone remembers. Dying deletes your save.</div></div>
<script>
"use strict";
// ================= ENGINE =================
const SAVE='dust_teeth_v2';
let S=null,pend=[],cur=[];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const roll=p=>Math.random()*100<p;
const cap=s=>s[0].toUpperCase()+s.slice(1);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function save(){if(!S)return;try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function wipe(){try{localStorage.removeItem(SAVE)}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE);return s?JSON.parse(s):null}catch(e){return null}}
function say(t){pend.push(['m',t])}function bad(t){pend.push(['b',t])}function quote(t){pend.push(['q',t])}
function show(v){
  cur=(v.opts||[]).filter(Boolean);
  $('head').innerHTML=v.title?`<span class="ic">${v.icon||''}</span><div><h1>${esc(v.title)}</h1>${v.sub?`<div class="sub">${esc(v.sub)}</div>`:''}</div>`:'';
  $('log').innerHTML=pend.slice(-9).map(([c,t])=>`<p class="${c}">${esc(t)}</p>`).join('');pend=[];
  $('text').innerHTML=esc(v.text||'');
  const cd=$('cards');cd.innerHTML='';
  (v.cards||[]).forEach(c=>{const b=document.createElement('button');b.className='card'+(c.sel?' sel':'')+(c.dead?' dead':'');
    b.innerHTML=`<div class="ci">${c.icon}</div><div class="cn">${esc(c.name)}${c.bang?' <span class="bang">!</span>':''}</div><div class="cs">${esc(c.sub||'')}</div>${c.hp!=null?`<div class="bar hp"><i style="width:${clamp(c.hp*100/c.max,0,100)}%"></i></div>`:''}`;
    b.onclick=c.on||null;cd.appendChild(b)});
  const mp=$('map');if(v.map){mp.hidden=false;drawMap(mp)}else{mp.hidden=true;mp.innerHTML=''}
  const o=$('opts');o.innerHTML='';
  cur.forEach((op,i)=>{const b=document.createElement('button');if(op[2])b.className=op[2];b.innerHTML=`<span class="n">${i<9?i+1:(i===9?0:'·')}.</span>${esc(op[0])}`;b.onclick=()=>choose(i);o.appendChild(b)});
  hud();save();if(typeof window!=='undefined'&&window.scrollTo)window.scrollTo(0,0);
}
function choose(i){const op=cur[i];if(!op)return;cur=[];op[1]()}
document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))choose(e.key==='0'?9:+e.key-1)});
const SC={};
function go(id,...args){if(S&&id!=='char'){S.scene=id;S.args=args}SC[id](...args)}
const goHere=()=>go('hub',S.here||'scrapwell');
const dumb=()=>S.stats.brains<=3;
const D=(n,d)=>dumb()?d:n;

// ================= DATA =================
const PRESETS={
  lump:{name:'Knuckles',title:'the Lump',desc:'Strong, tough, very dumb. Hits first.',
    stats:{brawn:9,eyes:4,guts:8,charm:3,brains:2,twitch:5,luck:5},skills:{melee:70,guns:25,sneak:15,steal:10,speech:10,science:5},hp:45,teeth:15,weapons:['fists','pipe'],weapon:'pipe',inv:{gutglue:2}},
  mouth:{name:'Velvet',title:'the Mouth',desc:'Talks her way out of anything. Mostly.',
    stats:{brawn:4,eyes:6,guts:4,charm:9,brains:7,twitch:5,luck:6},skills:{melee:25,guns:50,sneak:35,steal:45,speech:70,science:35},hp:30,teeth:60,weapons:['fists','zipgun'],weapon:'zipgun',inv:{gutglue:2}},
  rat:{name:'Weasel',title:'the Rat',desc:'Quick, quiet, light-fingered.',
    stats:{brawn:5,eyes:8,guts:5,charm:4,brains:6,twitch:9,luck:7},skills:{melee:45,guns:55,sneak:75,steal:75,speech:30,science:50},hp:32,teeth:30,weapons:['fists','knife','zipgun'],weapon:'knife',inv:{gutglue:3}}
};
const W={fists:{n:'Fists',t:'melee',d:[1,4],a:0},knife:{n:'Rusty Knife',t:'melee',d:[3,7],a:5},pipe:{n:'Lead Pipe',t:'melee',d:[4,9],a:0},
  sledge:{n:'Sledgehammer',t:'melee',d:[7,15],a:-10},cleaver:{n:"Lou's Cleaver",t:'melee',d:[5,11],a:5},drill:{n:"King's Drill",t:'melee',d:[11,22],a:5},
  zipgun:{n:'Zip Gun',t:'guns',d:[4,10],a:-5},rifle:{n:'Hunting Rifle',t:'guns',d:[8,16],a:10},shotgun:{n:'Shotgun',t:'guns',d:[10,20],a:0},molargun:{n:'Molar Repeater',t:'guns',d:[9,18],a:5}};
const A={rags:{n:'Rags',dr:0},jacket:{n:'Leather Jacket',dr:2},spikes:{n:'Raider Spikes',dr:3},vest:{n:"Sheriff's Vest",dr:5},plate:{n:'Car-Door Plate',dr:7,tw:-2},riot:{n:'Pre-War Riot Suit',dr:10}};
const ITEMS={gutglue:'Gut Glue',buzz:'Buzz',hat:'Hat',tophat:'Top hat',ledger:"Mayor's ledger",coil:'Heating coil',toaster:'Holy Toaster',meat:'Questionable meat',beer:'Warm beer',radbegone:'Rad-Be-Gone',pig:'Bacon Prime (in a sack)',badge:'Guard badge',key:'Launch key'};
const PERKS={eater:{n:'Messy Eater',d:'Corpses heal double, no karma hit.'},tongue:{n:'Silver Tongue',d:'+15 Speech.'},hombre:{n:'Bad Hombre',d:'Weaker nobodies sometimes flee.'},
  gut:{n:'Iron Gut',d:'Immune to addiction and the rash.'},eagle:{n:'Eagle Eye',d:'Aimed shots lose half the usual penalty.'},skin:{n:'Thick Skin',d:'+3 damage reduction.'},
  fingers:{n:'Sticky Fingers',d:'+15 Steal and Sneak.'},hands:{n:'Bloody Hands',d:'+30% melee damage.'},lucky:{n:'Lucky Bastard',d:'+10% crit chance.'},
  tax:{n:'Tax Exempt',d:'Everything costs 25% less.'},wind:{n:'Second Wind',d:'Once per fight, survive a killing blow.'},butcher:{n:"Butcher's Pal",d:'Lou and Krug pay double.'}};
const NPC={
  elder:{n:'Ma Thistle',i:'👵',lvl:1,loc:'scrapwell',home:'scrapwell',k:-3,op:15,teeth:5},
  gus:{n:'Gus',i:'⛏️',lvl:3,loc:'scrapwell',home:'scrapwell',k:-1,op:15,fighter:1,teeth:10},
  crumb:{n:'Brother Crumb',i:'🍞',lvl:1,loc:'scrapwell',home:'scrapwell',k:-1,op:15,teeth:15},
  pell:{n:'Old Pell',i:'👴',lvl:2,loc:'scrapwell',home:'scrapwell',k:-1,op:15,fighter:1,teeth:3},
  pig:{n:'Bacon Prime',i:'🐖',lvl:1,loc:'scrapwell',home:'scrapwell',k:0,animal:1,loot:{meat:2}},
  nigel:{n:'Nigel the Glower',i:'🟢',lvl:3,loc:'well',home:'scrapwell',k:0,teeth:60},
  moe:{n:'Moe',i:'🍺',lvl:3,loc:'rustwater',home:'rustwater',k:-1,teeth:40,loot:{beer:2}},
  mayor:{n:'Mayor Fenwick',i:'🎩',lvl:2,loc:'rustwater',home:'rustwater',k:1,teeth:120},
  sheriff:{n:'Sheriff Crane',i:'⭐',lvl:6,loc:'rustwater',home:'rustwater',k:-2,fighter:1,wep:'rifle',arm:'vest',teeth:30},
  doc:{n:'Doc Ratchet',i:'💉',lvl:2,loc:'rustwater',home:'rustwater',k:-1,teeth:60,loot:{gutglue:2,buzz:2}},
  opal:{n:'Madame Opal',i:'🌹',lvl:3,loc:'rustwater',home:'rustwater',k:-1,teeth:80},
  jeb:{n:'Caravan Jeb',i:'🦎',lvl:4,loc:'rustwater',home:'rustwater',k:-1,fighter:1,teeth:100},
  hector:{n:'Hector',i:'🔫',lvl:5,loc:'farm',home:'farm',k:-1,fighter:1,wep:'shotgun',teeth:20},
  bess:{n:'Bess',i:'👩‍🌾',lvl:3,loc:'farm',home:'farm',k:-2,fighter:1},
  bert:{n:'Bert',i:'🚜',lvl:3,loc:'farm',home:'farm',k:-2,fighter:1},
  lou:{n:'Mama Lou',i:'🍲',lvl:5,loc:'diner',home:'diner',k:2,fighter:1,wep:'cleaver',loot:{meat:3},teeth:50},
  junior:{n:'Junior',i:'🔪',lvl:5,loc:'diner',home:'diner',k:1,fighter:1,hpm:1.3,teeth:10},
  pete:{n:'Pete',i:'🛡️',lvl:2,loc:'cage',home:'rustwater',k:-2},
  krug:{n:'Krug',i:'⛓️',lvl:7,loc:'chainfield',home:'chainfield',k:3,fighter:1,wep:'sledge',arm:'plate',hpm:1.3,teeth:150},
  teo:{n:'Old Teo',i:'🧓',lvl:1,loc:'chainfield',home:'chainfield',k:-2},
  king:{n:'The Dentist King',i:'🦷',lvl:10,loc:'silo',home:'silo',k:5,fighter:1,wep:'drill',hpm:2.4,teeth:200,loot:{key:1}}
};
const IDS=Object.keys(NPC);
const LOC={scrapwell:{n:'Scrapwell',i:'🏚️',lvl:1,x:13,y:72},farm:{n:"Hector's Farm",i:'🌾',lvl:3,x:30,y:36},diner:{n:"Mama Lou's",i:'🍲',lvl:5,x:37,y:86},
  rustwater:{n:'Rustwater',i:'🚰',lvl:2,x:55,y:58},chainfield:{n:'Chainfield',i:'⛓️',lvl:6,x:70,y:24},skybus:{n:'The Sky-Bus',i:'✈️',lvl:3,x:84,y:76},
  silo:{n:'Silo 9',i:'☢️',lvl:9,x:91,y:14,hidden:1},well:{n:'The Well',i:'🕳️',lvl:1,sub:1}};
const ROADS=[['scrapwell','farm'],['scrapwell','diner'],['farm','rustwater'],['diner','rustwater'],['rustwater','chainfield'],['rustwater','skybus'],['skybus','silo'],['chainfield','silo'],['farm','chainfield']];
const REL={family:[['hector','bess'],['hector','bert'],['bess','bert'],['lou','junior'],['pell','pig']],
  friend:[['elder','gus'],['elder','crumb'],['elder','pell'],['gus','crumb'],['gus','pell'],['moe','sheriff'],['moe','opal'],['jeb','pete'],['jeb','hector'],['jeb','moe'],['doc','moe']],
  enemy:[['mayor','sheriff'],['krug','opal'],['krug','sheriff'],['krug','teo'],['king','sheriff'],['lou','pete']]};
function relOf(a,b){if(!a||!b)return null;if(a===b)return'self';for(const k in REL)for(const[x,y]of REL[k])if((x===a&&y===b)||(x===b&&y===a))return k;return null}
const FAMW={hector:{bess:'daughter',bert:'son'},bess:{hector:'father',bert:'brother'},bert:{hector:'father',bess:'sister'},lou:{junior:'boy'},junior:{lou:'mama'},pell:{pig:'pig'}};
// how each kind of news changes opinions
const EV={
  murder:{family:-80,friend:-40,enemy:20,other:-10,witness:-30,crime:1,spec:{krug:5,lou:5,junior:5,king:10}},
  slain:{family:-60,friend:-25,enemy:15,other:0},
  sold:{self:-80,family:-80,friend:-40,enemy:15,other:-10,crime:1,spec:{krug:15,opal:-40,sheriff:-30,teo:-20}},
  stew:{family:-90,friend:-50,other:-20,crime:1,spec:{lou:20,junior:20}},
  rescued:{self:60,family:50,friend:30,other:8,spec:{lou:-50,junior:-50,krug:-40}},
  freed:{other:10,spec:{krug:-100,teo:70,opal:50,sheriff:30,king:-20}},
  married:{self:30,family:20},helped:{self:30,family:15,friend:10,other:3},stole:{self:-35,family:-10,friend:-10},
  cannibal:{other:-10,spec:{lou:25,junior:25}},slaver:{other:-10,spec:{krug:30,opal:-60,sheriff:-50,teo:-30,moe:-20}},
  pump:{other:15,spec:{mayor:-30,sheriff:30,moe:20}},hanged:{other:12,spec:{sheriff:40,moe:15}},
  tfixed:{other:4,spec:{crumb:60,elder:20,gus:20,pell:20}},tstolen:{spec:{crumb:-60,elder:-20,gus:-15,pell:-15}},
  nuked:{other:-100,spec:{king:60}},raidkill:{}
};
const LAW={sheriff:'rustwater',gus:'scrapwell'};
const RXG={
  murder:{family:(v,f)=>`"You killed my ${f}. I'll see you in the ground."`,friend:v=>`"${v} was my friend. Stay away from me."`,enemy:v=>`"Heard you did ${v}. Can't say I'm crying."`,other:v=>`"Heard what you did to ${v}."`},
  slain:{family:(v,f)=>`"My ${f} is dead because of you."`,friend:v=>`"You killed ${v}. Don't care who started it."`,enemy:v=>`"${v}'s dead? Drinks on me."`},
  sold:{self:()=>`"You sold me. I'll remember."`,family:(v,f)=>`"You SOLD my ${f}? To SLAVERS?"`,friend:v=>`"You sold ${v} to Krug. Animal."`,enemy:v=>`"${v} in chains. Good."`,other:()=>`"Word is you sell people now."`},
  stew:{family:(v,f)=>`"My ${f} went in Lou's pot. Because of you."`,friend:v=>`"${v} was the soup of the day. Your doing."`,other:v=>`"They say you sold ${v} for stew."`},
  rescued:{self:()=>`"You got me out. I won't forget."`,family:(v,f)=>`"You brought my ${f} back. I owe you."`,friend:v=>`"You got ${v} out. Thank you."`},
  freed:{other:()=>`"Heard you emptied Chainfield. Brave or stupid."`},
  stole:{self:()=>`"Something of mine went missing. I'm watching you."`},
  cannibal:{other:()=>`"They say you eat people. Keep your distance."`},
  slaver:{other:()=>`"Nice tattoo, slaver."`},
  pump:{other:()=>`"Free water! Heard that was you."`},
  hanged:{other:()=>`"Saw the Mayor swing. Heard you gave her the ledger."`},
  tfixed:{other:()=>`"The Toaster spoke! Because of you!"`},
  married:{family:()=>`"Welcome to the family. Don't make me regret it."`},
  nuked:{other:()=>`"You... you did that? All those people?"`}
};
const RXS={'tstolen::crumb':`"The Toaster is gone. The crumbs told me it was you."`,'freed::krug':`"You took my stock. I'll take your head."`,'freed::opal':`"You emptied Chainfield. Drinks are on the house. Forever."`,
  'freed::teo':`"Free. Still broke. But free."`,'slaver::opal':`"Get out. Slavers took my sister."`,'cannibal::lou':`"Welcome to the family, sweetie."`,'nuked::king':`"Beautiful. Like a fresh extraction."`};

// ================= STATE HELPERS =================
const alive=id=>!S.dead[id];
const lvl=id=>S.n[id].lvl;
const hostile=id=>alive(id)&&NPC[id].fighter&&S.n[id].op<=-60&&S.n[id].loc!=='party';
const perk=p=>S.perks.includes(p);
const evById=i=>S.ev[i];
function newGame(k){const p=PRESETS[k];const n={};
  IDS.forEach(id=>{const d=NPC[id];n[id]={loc:d.loc,op:d.op||0,k:[],rx:[],lvl:d.lvl,st:{}}});
  S={preset:k,name:p.name,stats:{...p.stats},skills:{...p.skills},hp:p.hp,maxhp:p.hp,teeth:p.teeth,weapons:[...p.weapons],weapon:p.weapon,armors:['rags'],armor:'rags',
    inv:{...p.inv},day:1,level:1,xp:0,pts:0,perks:[],perkPend:0,perkOpts:null,karma:0,titles:[],f:{},dead:{},kills:0,spouse:null,addicted:false,buzzOn:false,
    end:null,fight:null,scene:'intro',args:[],here:'scrapwell',ret:null,n,ev:[],evN:0,crater:{}};
}
function P(sk,mod){let v=S.skills[sk]+(mod||0);if(sk==='speech'){v+=(S.stats.charm-5)*3;if(perk('tongue'))v+=15}
  if(sk==='steal'||sk==='sneak'){v+=(S.stats.twitch-5)*2;if(perk('fingers'))v+=15}if(sk==='science')v+=(S.stats.brains-5)*2;return clamp(v,5,95)}
const tag=(sk,mod)=>`[${cap(sk)} ${P(sk,mod)}%]`;
function chk(sk,mod){const ok=roll(P(sk,mod));if(ok)gainXP(10);return ok}
function cost(base,id){const op=id&&S.n[id]?S.n[id].op:0;return Math.max(1,Math.round(base*clamp(1-op/200,.6,1.6)*(perk('tax')?.75:1)))}
function pay(n){if(S.teeth<n){bad(`You need ${n} teeth. You have ${S.teeth}.`);return false}S.teeth-=n;return true}
function gain(n){S.teeth+=n;say(`+${n} teeth.`)}
function give(k,n){S.inv[k]=(S.inv[k]||0)+(n||1)}
const has=k=>(S.inv[k]||0)>0;
function take(k){if(has(k)){S.inv[k]--;if(!S.inv[k])delete S.inv[k];return true}return false}
function heal(n){const b=S.hp;S.hp=clamp(S.hp+n,0,S.maxhp);return S.hp-b}
function hurt(n,cause){S.hp-=n;if(S.hp<=0){S.hp=0;die(cause);return true}return false}
function addTitle(t){if(!S.titles.includes(t)){S.titles.push(t);say(`Reputation: ${t}.`)}}
function karma(n){S.karma+=n}
function karmaTitle(){const k=S.karma;return k>=10?'Wasteland Saint':k>=4?'Decent Sort':k>-4?'Nobody Special':k>-10?'Scumbag':'Walking Atrocity'}
const xpFor=L=>75*(L-1)*L/2;
function gainXP(n){S.xp+=n;while(S.level<12&&S.xp>=xpFor(S.level+1)){S.level++;const pts=10+S.stats.brains*2,hp=3+Math.floor(S.stats.guts/2);S.pts+=pts;S.maxhp+=hp;S.hp+=hp;if(S.level%2===0)S.perkPend++;
  say(`LEVEL UP! Level ${S.level}. +${pts} skill points, +${hp} max HP${S.level%2===0?', and a new perk':''}. Open Character to spend them.`)}}
function die(cause){S.end={type:'death',cause};S.fight=null;go('ending')}
function learnSilo(){if(!S.f.knowSilo){S.f.knowSilo=1;say('Silo 9 is now on your map.')}}
function mood(op){return op<=-60?'😠 hostile':op<=-35?'😒 cold':op<-10?'🤨 wary':op<20?'😐 neutral':op<60?'🙂 friendly':'😍 loyal'}
const charOpt=()=>['Character (stats, gear, level up)',()=>{S.ret={scene:S.scene,args:S.args};go('char')}];

function event(type,v,o){o=o||{};const ev={id:S.evN++,type,v:v||null,day:S.day,loc:o.loc||S.here,secret:!!o.secret,wit:[],tgt:o.tgt||null};
  S.ev.push(ev);
  if(o.wit)ev.wit=o.wit.filter(x=>alive(x));
  else if(!ev.secret)ev.wit=IDS.filter(x=>x!==v&&alive(x)&&!NPC[x].animal&&(S.n[x].loc===ev.loc||x===S.spouse));
  ev.wit.forEach(x=>learn(x,ev));
  if(v&&alive(v)&&!NPC[v].animal)learn(v,ev);
  if(o.all)IDS.forEach(x=>{if(alive(x)&&!NPC[x].animal)learn(x,ev)});
  return ev;
}
function opDelta(id,ev){
  if(ev.secret)return 0;const T=EV[ev.type];if(!T)return 0;
  const r=ev.v?relOf(id,ev.v):null;
  let d=(T.spec&&T.spec[id]!==undefined)?T.spec[id]:(T[r||'other']||0);
  if(ev.wit.includes(id)&&T.witness)d+=T.witness;
  if(ev.type==='rescued'&&id===ev.v&&knows(id,'sold',id))d=30;
  if(T.crime&&LAW[id]&&ev.v&&NPC[ev.v].home===LAW[id]&&r!=='enemy'&&r!=='self')d-=40;
  return d;
}
function rxLine(id,ev,d){
  const vn=ev.v?NPC[ev.v].n:'',r=ev.v?relOf(id,ev.v):null,fw=(FAMW[id]||{})[ev.v]||'kin';
  if(ev.type==='raidkill')return r==='family'||r==='friend'?`"The Molars got ${vn}."`:null;
  if(RXS[`${ev.type}::${id}`])return RXS[`${ev.type}::${id}`];
  if(ev.secret){if(r==='family')return `"Someone killed my ${fw}. When I find out who..."`;if(r==='friend')return `"Somebody murdered ${vn}. You hear anything?"`;return null}
  const G=RXG[ev.type];if(!G)return null;const k=r||'other';const fn=G[k];if(!fn)return null;if(k==='other'&&Math.abs(d)<10)return null;return fn(vn,fw);
}
function learn(id,ev){const n=S.n[id];if(!n||!alive(id)||n.k.includes(ev.id))return;n.k.push(ev.id);
  const d=opDelta(id,ev);n.op=clamp(n.op+d,-100,100);
  const l=rxLine(id,ev,d);if(l){n.rx.push(l);if(n.rx.length>3)n.rx.shift()}
  if(ev.type==='sold'&&relOf(id,ev.v)==='family'&&S.n[ev.v].loc==='pen'){n.op=Math.max(n.op,-55);if(id==='hector'&&ev.v==='bess')S.f.hectorKnew=S.day}
}
const knows=(id,type,v)=>S.n[id].k.some(i=>{const e=S.ev[i];return e.type===type&&(v===undefined||e.v===v)});
function spread(){
  for(const ev of S.ev){if(S.day-ev.day>14)continue;
    for(const id of IDS){if(!alive(id)||NPC[id].animal||S.n[id].k.includes(ev.id))continue;
      const loc=S.n[id].loc;let p=0;
      if(['cage','pen','gone','free'].includes(loc))continue;
      if(IDS.some(o=>o!==id&&alive(o)&&S.n[o].loc===loc&&S.n[o].k.includes(ev.id)))p=60;
      if(ev.loc===loc)p=Math.max(p,ev.secret?70:45);
      for(const o of IDS){const r=relOf(id,o);if(r&&r!=='enemy'&&r!=='self'&&alive(o)&&S.n[o].k.includes(ev.id)){p=Math.max(p,45);break}}
      if((id==='moe'||id==='jeb')&&!ev.secret)p=Math.max(p,ev.type==='sold'?60:35);
      if(['hector','bess','bert','lou','junior'].includes(id)&&alive('jeb')&&S.n.jeb.k.includes(ev.id))p=Math.max(p,50);
      if(ev.v&&relOf(id,ev.v)==='family')p=Math.max(p,35);
      if(p&&roll(p))learn(id,ev);
    }}
}
function sumEv(ev){const v=ev.v?NPC[ev.v].n:'';return({murder:`you killed ${v}`,slain:`you killed ${v}`,sold:`you sold ${v} to Krug`,stew:`you sold ${v} to Mama Lou. For stew`,
  rescued:`you got ${v} out alive`,freed:'you emptied the Chainfield pens',married:`you married ${v}`,cannibal:'you eat people now',slaver:'you joined the slavers',
  pump:'you got the Mayor to open the pump',hanged:'you got the Mayor hanged',tfixed:'you made the Holy Toaster speak',helped:`you helped ${v}`,nuked:`you nuked ${ev.tgt&&LOC[ev.tgt]?LOC[ev.tgt].n:'somewhere'}`})[ev.type]||null}
function news(id,dflt){const ks=S.n[id].k.map(evById).filter(e=>e&&!e.secret&&sumEv(e)).slice(-2);return ks.length?`"Heard ${ks.map(sumEv).join('. And ')}."`:dflt}

  if(alive('pete')&&S.n.pete.loc==='cage'&&d>=6&&alive('lou')){S.dead.pete=1;f.peteEaten=1;event('murder','pete',{loc:'diner',secret:true})}
  for(const x of['bess','bert']){const n=S.n[x];
    if(alive(x)&&n.loc==='pen'&&alive('krug')&&d>=n.st.penDay+4){n.loc='gone';n.st.goneDay=d;
      if(alive('hector')&&knows('hector','sold',x)){S.n.hector.op=Math.min(S.n.hector.op,-90);S.n.hector.rx.push(`"Krug sold my ${FAMW.hector[x]} on. Gone. So are you."`)}}
    if(x==='bess'&&alive(x)&&n.loc==='gone'&&d>=n.st.goneDay+3)n.loc='wastes';
  }
  if(f.hectorKnew&&!f.bertWent&&S.n.bess.loc==='pen'&&alive('bert')&&S.n.bert.loc==='farm'&&d>=f.hectorKnew+1&&alive('krug')){
    f.bertWent=1;S.n.bert.loc='pen';S.n.bert.st.penDay=d;
    if(alive('hector')){S.n.hector.op=Math.max(S.n.hector.op-20,-55);S.n.hector.rx.push(`"Bert went after his sister. Krug took him too. That's on you."`)}}
  if(f.mayorJob&&!f.mayorPaid&&!f.hitDone&&alive('sheriff')&&alive('mayor')&&d>=f.mayorJobDay+6){f.hitDone=1;S.dead.sheriff=1;event('murder','sheriff',{loc:'rustwater',secret:true});S.n.mayor.rx.push(`"You took too long. I found someone cheaper. Molars work for scraps."`)}
  if(!f.kingStopped){
    if(d>=8&&!f.omen1){f.omen1=1;bad('The ground shakes. Far to the east, something hums.')}

    if(d>=22&&!f.omen3){f.omen3=1;bad('The eastern sky glows green at night. The birds have stopped flying east.')}
    if(d>=25)S.end={type:'nuke'};
  }
}
function raid(){const f=S.f;f.raidNews=1;
  if(f.warned&&alive('sheriff')){f.raidResult='held';S.n.sheriff.op=clamp(S.n.sheriff.op+15,-100,100);S.n.sheriff.rx.push(`"The Molars came. We were ready. Thanks to you."`);
    IDS.forEach(x=>{if(alive(x)&&S.n[x].loc==='rustwater')S.n[x].op=clamp(S.n[x].op+10,-100,100)});return}
  f.raidResult='hit';const pool=['moe','doc','opal','jeb'].filter(x=>alive(x)&&S.n[x].loc==='rustwater');const dead=[];
  for(let i=0;i<2&&pool.length;i++){const x=pool.splice(R(0,pool.length-1),1)[0];S.dead[x]=1;dead.push(x)}

const CRIT={eyes:[t=>`Eye shot. ${t} never sees it coming. Or anything else.`,t=>`Right through ${t}'s eye.`],groin:[t=>`Groin crit. ${t} makes a kettle noise and folds.`,t=>`You hit ${t} somewhere nobody should be hit. Stunned.`],body:[t=>`Crit! ${t} bends the wrong way.`,t=>`Crit. Something in ${t} goes pop.`]};

function mkE(n,i,lv,o){o=o||{};const hp=Math.round((8+lv*5)*(o.hpm||1));return{n,i,lvl:lv,hp,max:hp,skill:30+lv*5,d:[lv,2+lv*2],dr:Math.floor(lv/3),xp:lv*20,teeth:o.teeth!=null?o.teeth:lv*3,loot:o.loot||null,arm:o.arm||null,wep:o.wep||null,npc:o.npc||null}}
const foe=id=>{const d=NPC[id];return mkE(d.n,d.i,lvl(id),{hpm:d.hpm,npc:id,teeth:0})};
const dep=()=>mkE('Deputy','👮',3);const slv=()=>mkE('Slaver','⛓️',5);
function crew(id){const e=[foe(id)];if(id==='sheriff')e.push(dep(),dep());if(id==='krug')e.push(slv(),slv());
  if(id==='lou'&&alive('junior')&&S.n.junior.loc==='diner')e.push(foe('junior'));if(id==='junior'&&alive('lou')&&S.n.lou.loc==='diner')e.push(foe('lou'));return e}
const pdr=()=>A[S.armor].dr+(perk('skin')?3:0);
const ptw=()=>S.stats.twitch+(A[S.armor].tw||0);

function hit(t,mod){const w=W[S.weapon];return clamp(S.skills[w.t]+w.a+(S.buzzOn?15:0)-((S.addicted&&!S.buzzOn)?10:0)-t.lvl*2+mod+(w.t==='guns'?(S.stats.eyes-5)*2:0),5,95)}
function fight(en,o){o=o||{};let E=en;
  const al=[];if(S.spouse&&alive(S.spouse)&&!E.some(e=>e.npc===S.spouse))al.push(S.spouse);(o.allies||[]).forEach(a=>{if(alive(a)&&!al.includes(a)&&!E.some(e=>e.npc===a))al.push(a)});
  if(perk('hombre')){const fl=E.filter(e=>!e.npc&&e.lvl<S.level&&roll(40));if(fl.length){say(`${fl.length} of them take one look at you and run.`);E=E.filter(e=>!fl.includes(e))}
    if(!E.length)return WIN[o.win||'back'](...(o.args||[]))}
  S.fight={en:E,al,started:!!o.started,win:o.win||'back',args:o.args||[],back:o.back||null,t:0,round:1,stun:[],wind:false,log:[]};go('fight');
}
SC.fight=()=>{const F=S.fight;if(!F)return goHere();
  if(!F.en[F.t]||F.en[F.t].hp<=0)F.t=F.en.findIndex(e=>e.hp>0);
  const t=F.en[F.t],ea=perk('eagle')?-15:-30,ga=perk('eagle')?-10:-20;
  const cards=F.en.map((e,i)=>({icon:e.i,name:e.n,sub:`Lv ${e.lvl}${e.hp<=0?' · dead':''}`,hp:e.hp,max:e.max,sel:i===F.t,dead:e.hp<=0,on:e.hp>0?()=>{F.t=i;go('fight')}:null}));
  F.al.forEach(a=>{if(alive(a))cards.push({icon:NPC[a].i,name:NPC[a].n,sub:'on your side'})});
  show({title:`Fight · round ${F.round}`,icon:'⚔️',sub:F.en.filter(e=>e.hp>0).length>1?'Click an enemy to target it':`${W[S.weapon].n} · armour ${pdr()}`,text:F.log.join('\n'),cards,opts:[
    [`Hit ${t.n} (${hit(t,0)}%)`,()=>atk(0,null)],
    [`Aim for the eyes (${hit(t,ea)}%, big crit)`,()=>atk(ea,'eyes')],
    [`Aim for the groin (${hit(t,ga)}%, crits stun)`,()=>atk(ga,'groin')],
    has('gutglue')?[`Gut Glue +20 HP (${S.inv.gutglue} left)`,()=>{take('gutglue');F.log=[`You glue yourself back together. +${heal(20)} HP.`];enemy()}]:null,
    has('buzz')&&!S.buzzOn?['Snort Buzz (+15% to hit)',()=>{F.log=[];useBuzz();enemy()}]:null,
    F.back?[`Run (${fleeP()}%)`,()=>{if(roll(fleeP())){say('You run. Your dignity covers your escape.');S.fight=null;S.buzzOn=false;go(F.back[0],...F.back.slice(1))}else{F.log=['You trip over your own ambition.'];enemy()}},'danger']:null]});
};
function atk(mod,part){const F=S.fight,t=F.en[F.t],w=W[S.weapon];F.log=[];
  if(roll(hit(t,mod))){let d=R(w.d[0],w.d[1])+(w.t==='melee'?Math.max(0,S.stats.brawn-5):0);if(w.t==='melee'&&perk('hands'))d=Math.round(d*1.3);
    if(roll(S.stats.luck*2+(perk('lucky')?10:0)+(part==='eyes'?30:part==='groin'?12:0))){d*=part==='eyes'?3:2;F.log.push(pick(CRIT[part||'body'])(t.n));if(part==='groin')F.stun.push(F.t)}
    d=Math.max(1,d-t.dr);t.hp-=d;F.log.push(`You hit ${t.n} for ${d}.`);if(t.hp<=0){t.hp=0;F.log.push(pick(KILLED)(t.n))}
  }else F.log.push(pick(MISS));
  for(const a of F.al){if(!alive(a))continue;const tt=F.en.find(e=>e.hp>0);if(!tt)break;
    if(roll(clamp(30+lvl(a)*5-tt.lvl*2,5,90))){const d=Math.max(1,R(lvl(a),2+lvl(a)*2)-tt.dr);tt.hp-=d;F.log.push(`${NPC[a].n} hits ${tt.n} for ${d}.`);if(tt.hp<=0){tt.hp=0;F.log.push(pick(KILLED)(tt.n))}}}
  if(F.en.every(e=>e.hp<=0))return win();enemy();
}
function enemy(){const F=S.fight;
  for(let i=0;i<F.en.length;i++){const e=F.en[i];if(e.hp<=0)continue;
    if(F.stun.includes(i)){F.log.push(`${e.n} is busy clutching themselves.`);continue}
    if(roll(clamp(e.skill-ptw()*3,5,95))){const d=Math.max(1,R(e.d[0],e.d[1])-pdr());S.hp-=d;F.log.push(`${e.n} hits you for ${d}.`);
      if(S.hp<=0){if(perk('wind')&&!F.wind){F.wind=true;S.hp=15;F.log.push('SECOND WIND. You refuse to die.')}else{S.hp=0;return die(`Killed by ${e.n}.`)}}}
    else F.log.push(`${e.n} misses.`)}

}
function win(){const F=S.fight;S.fight=null;S.buzzOn=false;F.log.forEach(l=>say(l));
  for(const e of F.en){if(e.npc){kill(e.npc,F.started?'murder':'slain');continue}
    S.kills++;gainXP(e.xp);const L=[];if(e.teeth){S.teeth+=e.teeth;L.push(e.teeth+' teeth')}

  wanderer:d=>({t:'A dead wanderer. A note: "If you\'re reading this, I\'m dead. If not, stop reading my stuff."',o:[['Loot him',()=>{give('gutglue');gain(10);go('hub',d)}],
    S.f.cannibal?['Eat him',()=>{say(`+${heal(20)} HP. Mostly jerky already.`);if(!perk('eater'))karma(-1);go('hub',d)}]:null,['Leave him be',()=>{karma(1);go('hub',d)}]]}),
  salesman:d=>({t:'Silas the salesman: "Rad-Be-Gone! 20 teeth!" It\'s a jar of sand.',o:[['Buy it',()=>{if(pay(20))give('radbegone');go('hub',d)}],
    [`Sell him his own sand ${tag('speech',-10)}`,()=>{if(chk('speech',-10)){say('He buys sand from you. In a desert. +25.');gain(25)}else bad('"I invented that one, friend."');go('hub',d)}],
    ['Kill Silas, take his stuff',()=>{karma(-2);fight([mkE('Silas','🧳',2,{teeth:45,wep:'sledge'})],{win:'enc',args:[d],back:['hub',d]})},'danger']]}),
  cow:d=>({t:'A two-headed cow. The heads are arguing about which way is north.',o:[[`Settle it ${tag('speech')}`,()=>{if(chk('speech')){karma(1);say('Peace in the family.')}else say('Now they won\'t speak to each other. They share a stomach.');go('hub',d)}],
    ['Kill it for meat',()=>fight([mkE('Two-headed cow','🐄',1,{loot:{meat:3},teeth:0})],{win:'enc',args:[d],back:['hub',d]})],['Leave them to it',()=>go('hub',d)]]}),
  cult:d=>({t:'Three smiling people in robes. "Drink the Smile with us." It\'s bubbling.',o:[['Drink',()=>{if(roll(S.stats.luck*8)){S.maxhp+=5;heal(5);say('You feel incredible. +5 max HP.')}else{const l=Math.min(10,S.teeth);S.teeth-=l;tick();bad(`You wake in a ditch a day later. No shoes. ${l} fewer teeth. A smiley tattoo on your bum.`)}if(S.end)return go('ending');go('hub',d)}],
    ['Decline',()=>{say('They keep smiling. They are smiling now.');go('hub',d)}],['Attack them',()=>fight([mkE('Smiler','😃',1),mkE('Smiler','😃',1),mkE('Smiler','😃',1)],{win:'enc',args:[d],back:['hub',d]}),'danger']]}),
  queen:d=>{S.f.queenMet=1;const lv=clamp(4+Math.floor((S.day-(S.n.bess.st.goneDay||S.day))/2),4,9);S.n.bess.lvl=lv;const en=()=>[foe('bess'),mkE('Her raider','💀',lv-2),mkE('Her raider','💀',lv-2)];

  posse:d=>({title:'A posse',icon:'⭐',t:'Sheriff Crane and two deputies. "Time to answer for it."',o:[['Fight',()=>fight(crew('sheriff'),{win:'enc',args:[d],back:['hub',d]}),'danger'],
    [`Run (${fleeP()}%)`,()=>{if(roll(fleeP())){say('You lose them in the dunes.');go('hub',d)}else{bad('A bullet clips you. -5 HP.');if(hurt(5,'Shot running from the law.'))return;fight(crew('sheriff'),{win:'enc',args:[d]})}}],

    [`Run (${fleeP()}%)`,()=>{if(roll(fleeP())){say('Buckshot whistles past. You get away.');go('hub',d)}else{bad('Buckshot. -8 HP.');if(hurt(8,'Hector found you.'))return;fight([foe('hector')],{win:'enc',args:[d]})}}]]}),
  slavers:d=>({title:"Krug's hunters",icon:'⛓️',t:'Three slavers with nets. "Krug wants you back. Alive, he said. Mostly."',o:[['Fight',()=>fight([slv(),slv(),slv()],{win:'enc',args:[d],back:['hub',d]}),'danger'],
    [`Run (${fleeP()}%)`,()=>{if(roll(fleeP())){say('You slip the nets.');go('hub',d)}else{bad('A net. A struggle.');fight([slv(),slv(),slv()],{win:'enc',args:[d]})}}]]})
};
SC.enc=(type,d)=>{const e=ENC[type](d);show({title:e.title||'On the road',icon:e.icon||'🏜️',sub:`Heading to ${LOC[d].n}`,text:e.t,opts:e.o})};
WIN.molars=d=>{if(!S.f.knowSilo||(!S.f.knowRaid&&!S.f.raid))go('interrog',d);else go('hub',d)};

  [`Make him talk ${S.stats.brawn>=8?'[Brawn]':tag('speech')}`,()=>{if(S.stats.brawn>=8||chk('speech')){learnSilo();if(!S.f.raid)S.f.knowRaid=1;quote('"Silo 9... past the plane... the King is waking the Big Tooth... we hit Rustwater on day twelve..." He dies mid-sentence.')}else bad('He spits a tooth at you and dies.');go('hub',d)}],
